m&quot;:&quot;Twitter&quot;},{&quot;url&quot;:&quot;https:\/\/facebook.com\/&quot;,&quot;platform&quot;:&quot;Facebook&quot;},{&quot;url&quot;:&quot;https:\/\/linkedin.com\/in\/&quot;,&quot;platform&quot;:&quot;Linkedin&quot;},{&quot;url&quot;:&quot;https:\/\/instagram.com\/&quot;,&quot;platform&quot;:&quot;Instagram&quot;}],&quot;jabatan_en&quot;:null,&quot;kata_kata_en&quot;:null,&quot;user_id&quot;:92,&quot;program_studi&quot;:{&quot;id&quot;:5,&quot;nama_program&quot;:&quot;D4  Teknologi Rekayasa Multimedia&quot;,&quot;slug&quot;:&quot;d4-teknologi-rekayasa-multimedia&quot;,&quot;gambar&quot;:null,&quot;warna_gradient&quot;:&quot;#ffffff,#f05d22&quot;,&quot;deskripsi&quot;:&quot;&lt;p&gt;Program Studi Sarjana Terapan Teknologi Rekayasa Multimedia Politeknik Negeri Batam fokus untuk menyiapkan lulusan yang memiliki kompetensi pada bidang multimedia serta memiliki kemampuan tambahan di bidang informatika untuk menghasilkan karya teknologi yang dapat berguna serta dapat diimplementasikan di dunia industri. Secara umum, mahasiswa prodi Teknologi Rekayasa Multimedia akan menempuh perkuliahan selama 8 semester atau 4 tahun.&lt;\/p&gt;&quot;,&quot;akreditasi&quot;:&quot;Baik Sekali&quot;,&quot;akreditasi_en&quot;:null,&quot;visi&quot;:&quot;&lt;p&gt;Menjadi program studi vokasional yang bermutu, unggul, adaptif, inovatif, dan bermitra erat dengan industri dan masyarakat di bidang multimedia untuk mendukung Indonesia Maju dan Sejahtera 2045.&lt;\/p&gt;&quot;,&quot;misi&quot;:&quot;&lt;p&gt;Aktif dalam proses kreasi, penyebaran dan penerapan sains dan teknologi di bidang multimedia melalui layanan pendidikan tinggi vokasi dan penelitian terapan yang bermutu, terbuka, relevan, dan berkolaborasi erat dengan masyarakat dan industri dengan penerapan tata kelola institusi yang baik untuk kehidupan bangsa yang lebih baik.&lt;\/p&gt;&quot;,&quot;tujuan&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Terwujudnya layanan, sumber daya dan ouput pembelajaran dan penelitian di bidang multimedia yang bermutu, akses terbuka, inovatif, relevan dengan kebutuhan industri dan masyarakat.&lt;\/li&gt;\r\n&lt;li&gt;Terwujudnya program studi yang transparan, akuntabel, produktif, dan bermutu.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;sasaran_strategis&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Meningkatnya mutu, akses, relevansi dari layanan, sumberdaya dan output pembelajaran vokasi di bidang multimedia&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya mutu dan relevansi penelitian, publikasi hasil penelitian serta kemampuan penerapan iptek dan inovasi di bidang multimedia.&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya transparansi, akuntabilitas, produktivitas berorientasi kelestarian lingkungan dan mutu layanan, serta tata kelola program studi.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;peo_professional&quot;:&quot;&lt;p&gt;Mampu mengidentifikasi, menganalisis, dan menyelesaikan masalah secara kreatif, inovatif, profesional serta menghasilkan produk serta jasa di bidang multimedia sesuai dengan perkembangan teknologi yang tepat guna dan beretika.&lt;\/p&gt;&quot;,&quot;peo_academic&quot;:&quot;&lt;p&gt;Terlibat dalam kegiatan pengembangan karir profesional dan mempertahankan keunggulan kompetitif dalam pembelajaran seumur hidup melalui pendidikan lebih lanjut, penelitian terapan dan kegiatan profesional lainnya.&lt;\/p&gt;&quot;,&quot;peo_social&quot;:&quot;&lt;p&gt;Memiliki kemampuan komunikasi yang baik, memiliki kepemimpinan dan jiwa kewirausahaan dan mampu berkolaborasi dengan industri dan masyarakat untuk menghasilkan produk dan jasa multimedia&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-06-18T09:22:03.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-18T08:45:57.000000Z&quot;,&quot;deskripsi_peo&quot;:&quot;&lt;p&gt;Program Educational Objective (PEO) atau Profil Profesional Mandiri adalah pernyataan yang secara luas menggambarkan karir dan pencapaian profesional yang dipersiapkan oleh program untuk dicapai lulusan beberapa tahun setelah lulus dari program pendidikan.&lt;\/p&gt;&quot;,&quot;deskripsi_cpl&quot;:&quot;&lt;p&gt;Pemetaan Capaian Pembelajaran Lulusan (CPL) Program Studi Teknologi Rekayasa Multimedia Terhadap CPL IABEE Engineering Technologist&lt;\/p&gt;&quot;,&quot;deskripsi_capaian&quot;:&quot;&lt;p&gt;Capaian Pembelajaran (CP) program studi D4 Teknologi Rekayasa Multimedia telah merujuk pada SN-Dikti (Permendikbud No 49 tahun 2014) dan memiliki level sesuai dengan jenjang Kerangka Kualifikasi Nasional Indonesia\/KKNI (Perpres No.8 Tahun 2014). Setiap lulusan program studi D4 Teknologi Rekayasa Multimedia memiliki capaian pembelajaran sebagai berikut&lt;\/p&gt;&quot;,&quot;deskripsi_kurikulum&quot;:&quot;&lt;p&gt;urikulum adalah perangkat mata kuliah dan program pendidikan yang diberikan oleh suatu lembaga penyelenggara pendidikan yang berisi rancangan pelajaran yang akan diberikan kepada peserta pelajaran dalam satu periode jenjang pendidikan&lt;\/p&gt;&quot;,&quot;deskripsi_peluang_kerja&quot;:&quot;&lt;p&gt;Lulusan Program Studi Teknologi Rekayasa Multimedia, telah berhasil terserap di dunia usaha dan industri, diantaranya perusahaan IT, BUMN, perusahaan pertambangan, perusahaan manufaktur, perbankan, Pegawai Negeri Sipil, dan wirausaha. Setelah mengikuti perkuliahan selama 8 semester, maka diharapkan para lulusan akan dapat menepati posisi kerja sebagai berikut&lt;\/p&gt;&quot;,&quot;akreditasi_gambar&quot;:&quot;program-studi\/akreditasi\/XZNJCYPPs1hm822cHUXroAfKN9wkcj0z7C1Nam1V.png&quot;,&quot;akreditasi_file&quot;:&quot;program-studi\/akreditasi\/0tlOL04p2nQZ8Yal6HGMtIHux38ulTZvBHgJdpjK.pdf&quot;,&quot;logo&quot;:&quot;program-studi\/logo\/DSiNtQaOthXzjDklvHDvbl3WnT3fQQroFG6cupUs.webp&quot;,&quot;logo_sidebar&quot;:&quot;program-studi\/logo\/lJTIOaIN0dbTH2B0NmRFCExOyxpunrAoSfgKh4c0.webp&quot;,&quot;deskripsi_en&quot;:null,&quot;visi_en&quot;:null,&quot;misi_en&quot;:null,&quot;tujuan_en&quot;:null,&quot;sasaran_strategis_en&quot;:null,&quot;peo_professional_en&quot;:null,&quot;peo_academic_en&quot;:null,&quot;peo_social_ t;url&quot;:&quot;https:\/\/instagram.com\/&quot;,&quot;platform&quot;:&quot;Instagram&quot;}],&quot;jabatan_en&quot;:null,&quot;kata_kata_en&quot;:null,&quot;user_id&quot;:93,&quot;program_studi&quot;:{&quot;id&quot;:5,&quot;nama_program&quot;:&quot;D4  Teknologi Rekayasa Multimedia&quot;,&quot;slug&quot;:&quot;d4-teknologi-rekayasa-multimedia&quot;,&quot;gambar&quot;:null,&quot;warna_gradient&quot;:&quot;#ffffff,#f05d22&quot;,&quot;deskripsi&quot;:&quot;&lt;p&gt;Program Studi Sarjana Terapan Teknologi Rekayasa Multimedia Politeknik Negeri Batam fokus untuk menyiapkan lulusan yang memiliki kompetensi pada bidang multimedia serta memiliki kemampuan tambahan di bidang informatika untuk menghasilkan karya teknologi yang dapat berguna serta dapat diimplementasikan di dunia industri. Secara umum, mahasiswa prodi Teknologi Rekayasa Multimedia akan menempuh perkuliahan selama 8 semester atau 4 tahun.&lt;\/p&gt;&quot;,&quot;akreditasi&quot;:&quot;Baik Sekali&quot;,&quot;akreditasi_en&quot;:null,&quot;visi&quot;:&quot;&lt;p&gt;Menjadi program studi vokasional yang bermutu, unggul, adaptif, inovatif, dan bermitra erat dengan industri dan masyarakat di bidang multimedia untuk mendukung Indonesia Maju dan Sejahtera 2045.&lt;\/p&gt;&quot;,&quot;misi&quot;:&quot;&lt;p&gt;Aktif dalam proses kreasi, penyebaran dan penerapan sains dan teknologi di bidang multimedia melalui layanan pendidikan tinggi vokasi dan penelitian terapan yang bermutu, terbuka, relevan, dan berkolaborasi erat dengan masyarakat dan industri dengan penerapan tata kelola institusi yang baik untuk kehidupan bangsa yang lebih baik.&lt;\/p&gt;&quot;,&quot;tujuan&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Terwujudnya layanan, sumber daya dan ouput pembelajaran dan penelitian di bidang multimedia yang bermutu, akses terbuka, inovatif, relevan dengan kebutuhan industri dan masyarakat.&lt;\/li&gt;\r\n&lt;li&gt;Terwujudnya program studi yang transparan, akuntabel, produktif, dan bermutu.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;sasaran_strategis&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Meningkatnya mutu, akses, relevansi dari layanan, sumberdaya dan output pembelajaran vokasi di bidang multimedia&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya mutu dan relevansi penelitian, publikasi hasil penelitian serta kemampuan penerapan iptek dan inovasi di bidang multimedia.&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya transparansi, akuntabilitas, produktivitas berorientasi kelestarian lingkungan dan mutu layanan, serta tata kelola program studi.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;peo_professional&quot;:&quot;&lt;p&gt;Mampu mengidentifikasi, menganalisis, dan menyelesaikan masalah secara kreatif, inovatif, profesional serta menghasilkan produk serta jasa di bidang multimedia sesuai dengan perkembangan teknologi yang tepat guna dan beretika.&lt;\/p&gt;&quot;,&quot;peo_academic&quot;:&quot;&lt;p&gt;Terlibat dalam kegiatan pengembangan karir profesional dan mempertahankan keunggulan kompetitif dalam pembelajaran seumur hidup melalui pendidikan lebih lanjut, penelitian terapan dan kegiatan profesional lainnya.&lt;\/p&gt;&quot;,&quot;peo_social&quot;:&quot;&lt;p&gt;Memiliki kemampuan komunikasi yang baik, memiliki kepemimpinan dan jiwa kewirausahaan dan mampu berkolaborasi dengan industri dan masyarakat untuk menghasilkan produk dan jasa multimedia&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-06-18T09:22:03.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-18T08:45:57.000000Z&quot;,&quot;deskripsi_peo&quot;:&quot;&lt;p&gt;Program Educational Objective (PEO) atau Profil Profesional Mandiri adalah pernyataan yang secara luas menggambarkan karir dan pencapaian profesional yang dipersiapkan oleh program untuk dicapai lulusan beberapa tahun setelah lulus dari program pendidikan.&lt;\/p&gt;&quot;,&quot;deskripsi_cpl&quot;:&quot;&lt;p&gt;Pemetaan Capaian Pembelajaran Lulusan (CPL) Program Studi Teknologi Rekayasa Multimedia Terhadap CPL IABEE Engineering Technologist&lt;\/p&gt;&quot;,&quot;deskripsi_capaian&quot;:&quot; ted_at&quot;:&quot;2026-07-13T02:30:45.000000Z&quot;,&quot;program_studi_id&quot;:5,&quot;nik&quot;:&quot;222333&quot;,&quot;pendidikan_terakhir&quot;:&quot;Sarjana Terapan (DIV)&quot;,&quot;email&quot;:&quot;widyaputri@polibatam.ac.id&quot;,&quot;riwayat_pendidikan&quot;:[{&quot;gelar&quot;:&quot;DIV Teknik Multimedia dan Jaringan&quot;,&quot;tahun&quot;:&quot;2021&quot;,&quot;institusi&quot;:&quot;Politeknik Negeri Batam&quot;}],&quot;sosial_media&quot;:[{&quot;url&quot;:&quot;https:\/\/sinta.kemdikbud.go.id\/authors\/profile\/&quot;,&quot;platform&quot;:&quot;Sinta&quot;},{&quot;url&quot;:&quot;https:\/\/orcid.org\/&quot;,&quot;platform&quot;:&quot;Scopus&quot;},{&quot;url&quot;:&quot;https:\/\/twitter.com\/&quot;,&quot;platform&quot;:&quot;Twitter&quot;},{&quot;url&quot;:&quot;https:\/\/facebook.com\/&quot;,&quot;platform&quot;:&quot;Facebook&quot;},{&quot;url&quot;:&quot;https:\/\/linkedin.com\/in\/&quot;,&quot;platform&quot;:&quot;Linkedin&quot;},{&quot;url&quot;:&quot;https:\/\/instagram.com\/&quot;,&quot;platform&quot;:&quot;Instagram&quot;}],&quot;jabatan_en&quot;:null,&quot;kata_kata_en&quot;:null,&quot;user_id&quot;:96,&quot;program_studi&quot;:{&quot;id&quot;:5,&quot;nama_program&quot;:&quot;D4  Teknologi Rekayasa Multimedia&quot;,&quot;slug&quot;:&quot;d4-teknologi-rekayasa-multimedia&quot;,&quot;gambar&quot;:null,&quot;warna_gradient&quot;:&quot;#ffffff,#f05d22&quot;,&quot;deskripsi&quot;:&quot;&lt;p&gt;Program Studi Sarjana Terapan Teknologi Rekayasa Multimedia Politeknik Negeri Batam fokus untuk menyiapkan lulusan yang memiliki kompetensi pada bidang multimedia serta memiliki kemampuan tambahan di bidang informatika untuk menghasilkan karya teknologi yang dapat berguna serta dapat diimplementasikan di dunia industri. Secara umum, mahasiswa prodi Teknologi Rekayasa Multimedia akan menempuh perkuliahan selama 8 semester atau 4 tahun.&lt;\/p&gt;&quot;,&quot;akreditasi&quot;:&quot;Baik Sekali&quot;,&quot;akreditasi_en&quot;:null,&quot;visi&quot;:&quot;&lt;p&gt;Menjadi program studi vokasional yang bermutu, unggul, adaptif, inovatif, dan bermitra erat dengan industri dan masyarakat di bidang multimedia untuk mendukung Indonesia Maju dan Sejahtera 2045.&lt;\/p&gt;&quot;,&quot;misi&quot;:&quot;&lt;p&gt;Aktif dalam proses kreasi, penyebaran dan penerapan sains dan teknologi di bidang multimedia melalui layanan pendidikan tinggi vokasi dan penelitian terapan yang bermutu, terbuka, relevan, dan berkolaborasi erat dengan masyarakat dan industri dengan penerapan tata kelola institusi yang baik untuk kehidupan bangsa yang lebih baik.&lt;\/p&gt;&quot;,&quot;tujuan&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Terwujudnya layanan, sumber daya dan ouput pembelajaran dan penelitian di bidang multimedia yang bermutu, akses terbuka, inovatif, relevan dengan kebutuhan industri dan masyarakat.&lt;\/li&gt;\r\n&lt;li&gt;Terwujudnya program studi yang transparan, akuntabel, produktif, dan bermutu.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;sasaran_strategis&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Meningkatnya mutu, akses, relevansi dari layanan, sumberdaya dan output pembelajaran vokasi di bidang multimedia&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya mutu dan relevansi penelitian, publikasi hasil penelitian serta kemampuan penerapan iptek dan inovasi di bidang multimedia.&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya transparansi, akuntabilitas, produktivitas berorientasi kelestarian lingkungan dan mutu layanan, serta tata kelola program studi.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;peo_professional&quot;:&quot;&lt;p&gt;Mampu mengidentifikasi, menganalisis, dan menyelesaikan masalah secara kreatif, inovatif, profesional serta menghasilkan produk serta jasa di bidang multimedia sesuai dengan perkembangan teknologi yang tepat guna dan beretika.&lt;\/p&gt;&quot;,&quot;peo_academic&quot;:&quot;&lt;p&gt;Terlibat dalam kegiatan pengembangan karir profesional dan mempertahankan keunggulan kompetitif dalam pembelajaran seumur hidup melalui pendidikan lebih lanjut, penelitian terapan dan kegiatan profesional lainnya.&lt;\/p&gt;&quot;,&quot;peo_social&quot;:&quot;&lt;p&gt;Memiliki kemampuan komunikasi yang baik, memiliki kepemimpinan dan jiwa kewirausahaan dan mampu berkolaborasi dengan industri dan masyarakat untuk menghasilkan produk dan jasa multimedia&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-06-18T09:22:03.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-18T08:45:57.000000Z&quot;,&quot;deskripsi_peo&quot;:&quot;&lt;p&gt;Program Educational Objective (PEO) atau Profil Profesional Mandiri adalah pernyataan yang secara luas menggambarkan karir dan pencapaian profesional yang dipersiapkan oleh program untuk dicapai lulusan beberapa tahun setelah lulus dari program pendidikan.&lt;\/p&gt;&quot;,&quot;deskripsi_cpl&quot;:&quot;&lt;p&gt;Pemetaan Capaian Pembelajaran Lulusan (CPL) Program Studi Teknologi Rekayasa Multimedia Terhadap CPL IABEE Engineering Technologist&lt;\/p&gt;&quot;,&quot;deskripsi_capaian&quot;:&quot;&lt;p&gt;Capaian Pembelajaran (CP) program studi D4 Teknologi Rekayasa Multimedia telah merujuk pada SN-Dikti (Permendikbud No 49 tahun 2014) dan memiliki level sesuai dengan jenjang Kerangka Kualifikasi Nasional Indonesia\/KKNI (Perpres No.8 Tahun 2014). Setiap lulusan program studi D4 Teknologi Rekayasa Multimedia memiliki capaian pembelajaran sebagai berikut&lt;\/p&gt;&quot;,&quot;deskripsi_kurikulum&quot;:&quot;&lt;p&gt;urikulum adalah perangkat mata kuliah dan program pendidikan yang diberikan oleh suatu lembaga penyelenggara pendidikan yang berisi rancangan pelajaran yang akan diberikan kepada peserta pelajaran dalam satu periode jenjang pendidikan&lt;\/p&gt;&quot;,&quot;deskripsi_peluang_kerja&quot;:&quot;&lt;p&gt;Lulusan Program Studi Teknologi Rekayasa Multimedia, telah berhasil terserap di dunia usaha dan industri, diantaranya perusahaan IT, BUMN, perusahaan pertambangan, perusahaan manufaktur, perbankan, Pegawai Negeri Sipil, dan wirausaha. Setelah mengikuti perkuliahan selama 8 semester, maka diharapk a\/&quot;,&quot;show_akreditasi&quot;:true,&quot;show_vmts&quot;:true,&quot;show_profil&quot;:true,&quot;show_cpl&quot;:true,&quot;show_capaian&quot;:false,&quot;show_kurikulum&quot;:true,&quot;show_profil_lulusan&quot;:true,&quot;show_fasilitas&quot;:true,&quot;show_dosen&quot;:true,&quot;show_berita&quot;:true,&quot;link_kurikulum&quot;:null}},{&quot;id&quot;:104,&quot;nama&quot;:&quot;Miftahul Husna Ghawa, S.Tr.Kom&quot;,&quot;nidn&quot;:&quot;225359&quot;,&quot;jabatan&quot;:&quot;Laboran&quot;,&quot;kategori&quot;:&quot;Tenaga Pendidik&quot;,&quot;keahlian&quot;:&quot;UI\/UX Design, Graphic Design, Branding, Visual Identity&quot;,&quot;kata_kata&quot;:null,&quot;gambar&quot;:&quot;dosen\/wixz9pBCQb13WHpTdikq5ZEc8VahAOb5rGQsrVxK.jpg&quot;,&quot;created_at&quot;:&quot;2026-07-09T08:49:47.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-07-13T08:04:23.000000Z&quot;,&quot;program_studi_id&quot;:5,&quot;nik&quot;:&quot;225359&quot;,&quot;pendidikan_terakhir&quot;:&quot;Sarjana Terapan (DIV)&quot;,&quot;email&quot;:&quot;miftahul@polibatam.ac.id&quot;,&quot;riwayat_pendidikan&quot;:[{&quot;gelar&quot;:&quot;Sarjana Terapan (D4) Politeknik Negeri Batam - Multimedia &amp; Jaringan&quot;,&quot;tahun&quot;:null,&quot;institusi&quot;:null}],&quot;sosial_media&quot;:[{&quot;url&quot;:&quot;https:\/\/sinta.kemdikbud.go.id\/authors\/profile\/&quot;,&quot;platform&quot;:&quot;Sinta&quot;},{&quot;url&quot;:&quot;https:\/\/orcid.org\/&quot;,&quot;platform&quot;:&quot;Scopus&quot;},{&quot;url&quot;:&quot;https:\/\/twitter.com\/&quot;,&quot;platform&quot;:&quot;Twitter&quot;},{&quot;url&quot;:&quot;https:\/\/facebook.com\/&quot;,&quot;platform&quot;:&quot;Facebook&quot;},{&quot;url&quot;:&quot;https:\/\/linkedin.com\/in\/&quot;,&quot;platform&quot;:&quot;Linkedin&quot;},{&quot;url&quot;:&quot;https:\/\/instagram.com\/&quot;,&quot;platform&quot;:&quot;Instagram&quot;}],&quot;jabatan_en&quot;:null,&quot;kata_kata_en&quot;:null,&quot;user_id&quot;:101,&quot;program_studi&quot;:{&quot;id&quot;:5,&quot;nama_program&quot;:&quot;D4  Teknologi Rekayasa Multimedia&quot;,&quot;slug&quot;:&quot;d4-teknologi-rekayasa-multimedia&quot;,&quot;gambar&quot;:null,&quot;warna_gradient&quot;:&quot;#ffffff,#f05d22&quot;,&quot;deskripsi&quot;:&quot;&lt;p&gt;Program Studi Sarjana Terapan Teknologi Rekayasa Multimedia Politeknik Negeri Batam fokus untuk menyiapkan lulusan yang memiliki kompetensi pada bidang multimedia serta memiliki kemampuan tambahan di bidang informatika untuk menghasilkan karya teknologi yang dapat berguna serta dapat diimplementasikan di dunia industri. Secara umum, mahasiswa prodi Teknologi Rekayasa Multimedia akan menempuh perkuliahan selama 8 semester atau 4 tahun.&lt;\/p&gt;&quot;,&quot;akreditasi&quot;:&quot;Baik Sekali&quot;,&quot;akreditasi_en&quot;:null,&quot;visi&quot;:&quot;&lt;p&gt;Menjadi program studi vokasional yang bermutu, unggul, adaptif, inovatif, dan bermitra erat dengan industri dan masyarakat di bidang multimedia untuk mendukung Indonesia Maju dan Sejahtera 2045.&lt;\/p&gt;&quot;,&quot;misi&quot;:&quot;&lt;p&gt;Aktif dalam proses kreasi, penyebaran dan penerapan sains dan teknologi di bidang multimedia melalui layanan pendidikan tinggi vokasi dan penelitian terapan yang bermutu, terbuka, relevan, dan berkolaborasi erat dengan masyarakat dan industri dengan penerapan tata kelola institusi yang baik untuk kehidupan bangsa yang lebih baik.&lt;\/p&gt;&quot;,&quot;tujuan&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Terwujudnya layanan, sumber daya dan ouput pembelajaran dan penelitian di bidang multimedia yang bermutu, akses terbuka, inovatif, relevan dengan kebutuhan industri dan masyarakat.&lt;\/li&gt;\r\n&lt;li&gt;Terwujudnya program studi yang transparan, akuntabel, produktif, dan bermutu.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;sasaran_strategis&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Meningkatnya mutu, akses, relevansi dari layanan, sumberdaya dan output pembelajaran vokasi di bidang multimedia&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya mutu dan relevansi penelitian, publikasi hasil penelitian serta kemampuan penerapan iptek dan inovasi di bidang multimedia.&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya transparansi, akuntabilitas, produktivitas berorientasi kelestarian lingkungan dan mutu layanan, serta tata kelola program studi.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;peo_professional&quot;:&quot;&lt;p&gt;Mampu mengidentifikasi, menganalisis, dan menyelesaikan masalah secara kreatif, inovatif, profesional serta menghasilkan produk serta jasa di bidang multimedia sesuai dengan perkembangan teknologi yang tepat guna dan beretika.&lt;\/p&gt;&quot;,&quot;peo_academic&quot;:&quot;&lt;p&gt;Terlibat dalam kegiatan pengembangan karir profesional dan mempertahankan keunggulan kompetitif dalam pembelajaran seumur hidup melalui pendidikan lebih lanjut, penelitian terapan dan kegiatan profesional lainnya.&lt;\/p&gt;&quot;,&quot;peo_social&quot;:&quot;&lt;p&gt;Memiliki kemampuan komunikasi yang baik, memiliki kepemimpinan dan jiwa kewirausahaan dan mampu berkolaborasi dengan industri dan masyarakat untuk menghasilkan produk dan jasa multimedia&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-06-18T09:22:03.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-18T08:45:57.000000Z&quot;,&quot;deskripsi_peo&quot;:&quot;&lt;p&gt;Program Educational Objective (PEO) atau Profil Profesional Mandiri adalah pernyataan yang secara luas menggambarkan karir dan pencapaian profesional yang dipersiapkan oleh program untuk dicapai lulusan beberapa tahun setelah lulus dari program pendidikan.&lt;\/p&gt;&quot;,&quot;deskripsi_cpl&quot;:&quot;&lt;p&gt;Pemetaan Capaian Pembelajaran Lulusan (CPL) Program Studi Teknologi Rekayasa Multimedia Terhadap CPL IABEE Engineering Technologist&lt;\/p&gt;&quot;,&quot;deskripsi_capaian&quot;:&quot;&lt;p&gt;Capaian Pembelajaran (CP) program studi D4 Teknologi Rekayasa Multimedia telah merujuk pada SN-Dikti (Permendikbud No 49 tahun 2014) dan memiliki level sesuai dengan jenjang Kerangka Kualifikasi Nasional Indonesia\/KKNI (Perpres No.8 Tahun 2014). Setiap lulusan program studi D4 Teknologi Rekayasa Multimedia memiliki capaian pembelajaran sebagai berikut&lt;\/p&gt;&quot;,&quot;deskripsi_kurikulum&quot;:&quot;&lt;p&gt;urikulum adalah perangkat mata kuliah dan program pendidikan yang diberikan oleh suatu lembaga penyelenggara pendidikan yang berisi rancangan pelajaran yang akan diberikan kepada peserta pelajaran dalam satu periode jenjang pendidikan&lt;\/p&gt;&quot;,&quot;deskripsi_peluang_kerja&quot;:&quot;&lt;p&gt;Lulusan Program Studi Teknologi Rekayasa Multimedia, telah berhasil terserap di dunia usaha dan industri, diantaranya perusahaan IT, BUMN, perusahaan pertambangan, perusahaan manufaktur, perbankan, Pegawai Negeri Sipil, dan wirausaha. Setelah mengikuti perkuliahan selama 8 semester, maka diharapkan para lulusan akan dapat menepati posisi kerja sebagai berikut&lt;\/p&gt;&quot;,&quot;akreditasi_gambar&quot;:&quot;program-studi\/akreditasi\/XZNJCYPPs1hm822cHUXroAfKN9wkcj0z7C1Nam1V.png&quot;,&quot;akreditasi_file&quot;:&quot;program-studi\/akreditasi\/0tlOL04p2nQZ8Yal6HGMtIHux38ulTZvBHgJdpjK.pdf&quot;,&quot;logo&quot;:&quot;program-studi\/logo\/DSiNtQaOthXzjDklvHDvbl3WnT3fQQroFG6cupUs.webp&quot;,&quot;logo_sidebar&quot;:&quot;program-studi\/logo\/lJTIOaIN0dbTH2B0NmRFCExOyxpunrAoSfgKh4c0.webp&quot;,&quot;deskripsi_en&quot;:null,&quot;visi_en&quot;:null,&quot;misi_en&quot;:null,&quot;tujuan_en&quot;:null,&quot;sasaran_strategis_en&quot;:null,&quot;peo_professional_en&quot;:null,&quot;peo_academic_en&quot;:null,&quot;peo_social_en&quot;:null,&quot;deskripsi_peo_en&quot;:null,&quot;deskripsi_cpl_en&quot;:null,&quot;deskripsi_capaian_en&quot;:null,&quot;deskripsi_kurikulum_en&quot;:null,&quot;deskripsi_peluang_kerja_en&quot;:null,&quot;website_url&quot;:&quot;https:\/\/if.polibatam.ac.id\/trm\/&quot;,&quot;show_akreditasi&quot;:true,&quot;show_vmts&quot;:true,&quot;show_profil&quot;:true,&quot;show_cpl&quot;:true,&quot;show_capaian&quot;:false,&quot;show_kurikul hrjh.webp&quot;,&quot;logo_sidebar&quot;:&quot;program-studi\/logo\/vr3Tlw7bmZyeCWEL25wizQHNwKXpPdo6BbD1L3mS.webp&quot;,&quot;deskripsi_en&quot;:null,&quot;visi_en&quot;:null,&quot;misi_en&quot;:null,&quot;tujuan_en&quot;:null,&quot;sasaran_strategis_en&quot;:null,&quot;peo_professional_en&quot;:null,&quot;peo_academic_en&quot;:null,&quot;peo_social_en&quot;:null,&quot;deskripsi_peo_en&quot;:null,&quot;deskripsi_cpl_en&quot;:null,&quot;deskripsi_capaian_en&quot;:null,&quot;deskripsi_kurikulum_en&quot;:null,&quot;deskripsi_peluang_kerja_en&quot;:null,&quot;website_url&quot;:&quot;https:\/\/if.polibatam.ac.id\/rekayasa-keamanan-siber\/&quot;,&quot;show_akreditasi&quot;:true,&quot;show_vmts&quot;:true,&quot;show_profil&quot;:true,&quot;show_cpl&quot;:true,&quot;show_capaian&quot;:false,&quot;show_kurikulum&quot;:true,&quot;show_profil_lulusan&quot;:true,&quot;show_fasilitas&quot;:true,&quot;show_dosen&quot;:true,&quot;show_berita&quot;:true,&quot;link_kurikulum&quot;:null}},{&quot;id&quot;:107,&quot;nama&quot;:&quot;Firmal, S.Pd&quot;,&quot;nidn&quot;:&quot;217267&quot;,&quot;jabatan&quot;:&quot;Tata Usaha&quot;,&quot;kategori&quot;:&quot;Staf Tata Usaha&quot;,&quot;keahlian&quot;:null,&quot;kata_kata&quot;:null,&quot;gambar&quot;:&quot;dosen\/du7eQSGBjQfVWPL2n1UsJEltFlxL0O5DGV4SwCI0.png&quot;,&quot;created_at&quot;:&quot;2026-07-13T09:47:19.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-07-24T15:37:43.000000Z&quot;,&quot;program_studi_id&quot;:4,&quot;nik&quot;:&quot;217267&quot;,&quot;pendidikan_terakhir&quot;:&quot;Sarjana (S1)&quot;,&quot;email&quot;:&quot;firmal@polibatam.ac.id&quot;,&quot;riwayat_pendidikan&quot;:[{&quot;gelar&quot;:&quot;Sarjana (S1)&quot;,&quot;tahun&quot;:&quot;2014&quot;,&quot;institusi&quot;:&quot;Universitas Riau Kepulauan&quot;}],&quot;sosial_media&quot;:[],&quot;jabatan_en&quot;:&quot;Tata Usaha&quot;,&quot;kata_kata_en&quot;:null,&quot;user_id&quot;:105,&quot;program_studi&quot;:{&quot;id&quot;:4,&quot;nama_program&quot;:&quot;D3 Teknik Informatika&quot;,&quot;slug&quot;:&quot;d3-teknik-informatika&quot;,&quot;gambar&quot;:&quot;program-studi\/1ZNUEU4dQ3iUYb6xLEgz4Iq2kbLzO3I8FT1rYRf4.jpg&quot;,&quot;warna_gradient&quot;:&quot;#ffffff,#21bdc0&quot;,&quot;deskripsi&quot;:&quot;&lt;p&gt;Teknik Informatika merupakan program studi yang mengkhususkan pada pengembangan aplikasi software dan hardware untuk tujuan tertentu. Lulusan memiliki keterampilan yang baik di bidang pemrograman dan jaringan serta kemampuan tambahan di bidang multimedia.&lt;\/p&gt;&quot;,&quot;akreditasi&quot;:&quot;Unggul&quot;,&quot;akreditasi_en&quot;:null,&quot;visi&quot;:&quot;&lt;p&gt;Menjadi program studi yang unggul dalam pengembangan keilmuan rekayasa perangkat lunak, komputasi cerdas, dan sistem jaringan, berkontribusi pada pemecahan masalah industri dan masyarakat melalui pendekatan teknologi terapan, serta mendorong inovasi digital untuk mendukung Indonesia maju dan sejahtera.&lt;\/p&gt;&quot;,&quot;misi&quot;:&quot;&lt;p&gt;Aktif dalam proses kreasi, penyebaran dan penerapan sains dan teknologi di bidang keilmuan rekayasa perangkat lunak, komputasi cerdas, dan sistem jaringan, melalui layanan pendidikan tinggi vokasi dan penelitian terapan yang bermutu, terbuka, relevan, dan berkolaborasi erat dengan masyarakat dan industri dengan penerapan tata kelola program studi yang baik untuk kehidupan bangsa yang lebih baik.&lt;\/p&gt;&quot;,&quot;tujuan&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Meningkatkan kualitas pendidikan tinggi vokasi dan penelitian terapan di bidang keilmuan rekayasa perangkat lunak, komputasi cerdas, dan sistem jaringan.&lt;\/li&gt;\r\n&lt;li&gt;Membangun ekosistem kemitraan yang kuat dengan industri dan masyarakat.&lt;\/li&gt;\r\n&lt;li&gt;Mendorong tata kelola program studi yang baik&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;sasaran_strategis&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Improving academic standards for global competitiveness.&lt;\/li&gt;\r\n&lt;li&gt;Increasing openness and expanding access to education.&lt;\/li&gt;\r\n&lt;li&gt;Increasing the relevance of education to developments in science and technology and the needs of the industrial sector.&lt;\/li&gt;\r\n&lt;li&gt;Implementing research that aligns with the needs of industry and society and has a global impact.&lt;\/li&gt;\r\n&lt;li&gt;Developing human resource competencies.&lt;\/li&gt;\r\n&lt;li&gt;Improving facilities and infrastructure for Tridharma activities.&lt;\/li&gt;\r\n&lt;li&gt;Strengthening partnerships and industry and community networks.&lt;\/li&gt;\r\n&lt;li&gt;Developing professional training and certification with industry.&lt;\/li&gt;\r\n&lt;li&gt;Increasing transparency and accountability.&lt;\/li&gt;\r\n&lt;li&gt;Improving the quality of public services and stakeholder participation.&lt;\/li&gt;\r\n&lt;li&gt;Improving the quality of risk management, evaluation, and continuous improvement.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;peo_professional&quot;:&quot;&lt;p&gt;Lulusan berkarir sebagai tenaga profesional di bidang informatika yang mampu berkontribusi dalam pengembangan produk dan layanan berbasis teknologi secara kreatif, inovatif, dan sesuai dengan kebutuhan industri.&lt;\/p&gt;&quot;,&quot;peo_academic&quot;:&quot;&lt;p&gt;Lulusan memiliki kemampuan untuk mengembangkan diri secara berkelanjutan dalam bidang informatika melalui peningkatan kompetensi profesional, adaptasi terhadap perkembangan teknologi, dan keterlibatan dalam aktivitas pembelajaran sepanjang hayat.&lt;\/p&gt;&quot;,&quot;peo_social&quot;:&quot;&lt;p&gt;Lulusan berperan aktif dalam lingkungan kerja dan masyarakat dengan menjunjung profesionalisme, mampu beradaptasi dalam tim, serta berkontribusi dalam pemanfaatan teknologi untuk mendukung penyelesaian permasalahan di bidang informatika.&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-06-18T07:53:36.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-07-13T08:30:12.000000Z&quot;,&quot;deskripsi_peo&quot;:&quot;&lt;p&gt;Program Educational Objective (PEO) atau Profil Profesional Mandiri adalah pernyataan yang secara luas menggambarkan karir dan pencapaian profesional yang dipersiapkan oleh program untuk dicapai lulusan beberapa tahun setelah lulus dari program pendidikan.&lt;\/p&gt;&quot;,&quot;deskripsi_cpl&quot;:&quot;&lt;p&gt;Capaian Pembelajaran Lulusan (CPL) Program Studi D3 Teknik Informatika Politeknik Negeri Batam dirumuskan sebagai kompetensi yang harus dimiliki oleh setiap lulusan sesuai dengan kebutuhan dunia industri dan perkembangan teknologi.&lt;\/p&gt;&quot;,&quot;deskripsi_capaian&quot;:&quot;&lt;p&gt;Capaian Pembelajaran (CP) program studi D3 Teknik Informatika telah merujuk pada SN-Dikti (Permendikbud No 49 tahun 2014) dan memiliki level sesuai dengan jenjang Kerangka Kualifikasi Nasional Indonesia\/KKNI (Perpres No.8 Tahun 2014). Setiap lulusan program studi D3 Teknik Informatika memiliki capaian pembelajaran sebagai berikut&lt;\/p&gt;&quot;,&quot;deskripsi_kurikulum&quot;:&quot;&lt;p&gt;Kurikulum adalah perangkat mata kuliah dan program pendidikan yang diberikan oleh suatu lembaga penyelenggara pendidikan yang berisi rancangan pelajaran yang akan diberikan kepada peserta pelajaran dalam satu periode jenjang pendidikan&lt;\/p&gt;&quot;,&quot;deskripsi_peluang_kerja&quot;:&quot;&lt;p&gt;Lulusan Program Studi Teknik Informatika, telah berhasil terserap di dunia usaha dan industri, diantaranya perusahaan IT, BUMN, perusahaan pertambangan, perusahaan manufaktur, perbankan, Pegawai Negeri Sipil, dan wirausaha. Setelah mengikuti perkuliahan selama 6 semester, maka diharapkan para lulusan akan dapat menepati posisi kerja sebagai berikut&lt;\/p&gt;&quot;,&quot;akreditasi_gambar&quot;:&quot;program-studi\/akreditasi\/1vRaNeEzygoDzOSJAVGYSuE90DQ6K6pRFTfFcaYg.jpg&quot;,&quot;akreditasi_file&quot;:&quot;program-studi\/akreditasi\/uwXbw875bomXQdMHL6BYLtDRNpEGiNcYqhgdTAqi.pdf&quot;,&quot;logo&quot;:&quot;program-studi\/logo\/C7DlF7Y6ZjdlMxI6FSeR5KC3A6bEEREbr86JwBnc.webp&quot;,&quot;logo_sidebar&quot;:&quot;program-studi\/logo\/Aj1LzX8mzRPB8yKrKr4SZe2OzK7F2w3CTa7eLMuy.webp&quot;,&quot;deskripsi_en&quot;:&quot;&lt;p&gt;Informatics Engineering is a study program that specializes in developing software and hardware applications for specific purposes. Graduates possess strong programming and networking skills, as well as additional skills in multimedia.&lt;\/p&gt;&quot;,&quot;visi_en&quot;:&quot;&lt;p&gt;To become a leading study program in the development of software engineering, intelligent computing, and network systems, contributing to solving industrial and societal problems through applied technology approaches, and encouraging digital innovation to support Indonesia&#039;s progress and prosperity.&lt;\/p&gt;&quot;,&quot;misi_en&quot;:&quot;&lt;p&gt;Active in the process of creation, dissemination and application of science and technology in the fields of software engineering, intelligent computing, and network systems, through vocational higher education services and applied research that are high quality, open, relevant, and in close collaboration with the community and industry by implementing good study program governance for a better life for the nation.&lt;\/p&gt;&quot;,&quot;tujuan_en&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Improving the quality of vocational higher education and applied research in the fields of software engineering, intelligent computing, and network systems.&lt;\/li&gt;\r\n&lt;li&gt;Building a strong partnership ecosystem with industry and the community.&lt;\/li&gt;\r\n&lt;li&gt;Encouraging good study program governance.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;sasaran_strategis_en&quot;:null,&quot;peo_professional_en&quot;:&quot;&lt;p&gt;Graduates will have careers as professionals in the field of informatics who are able to contribute to the development of technology-based products and services creatively, innovatively, and in accordance with industry needs.&lt;\/p&gt;&quot;,&quot;peo_academic_en&quot;:&quot;&lt;p&gt;Graduates have the ability to develop themselves sustainably in the field of informatics through increasing professional competence, adapting to technological developments, and engaging in lifelong learning activities.&lt;\/p&gt;&quot;,&quot;peo_social_en&quot;:&quot;&lt;p&gt;Graduates play an active role in the workplace and society by upholding professionalism, being able to adapt in teams, and contributing to the use of technology to support problem solving in the field of informatics.&lt;\/p&gt;&quot;,&quot;deskripsi_peo_en&quot;:&quot;&lt;p&gt;The Program Educational Objective (PEO) or Independent Professional Profile is a statement that broadly describes the career and professional achievements that the program prepares graduates to achieve several years after graduating from the educational program.&lt;\/p&gt;&quot;,&quot;deskripsi_cpl_en&quot;:&quot;&lt;p&gt;Graduate Learning Outcomes (CPL) of the D3 Informatics Engineering Study Program at Batam State Polytechnic are formulated as competencies that must be possessed by each graduate in accordance with the needs of the industrial world and technological developments.&lt;\/p&gt;&quot;,&quot;deskripsi_capaian_en&quot;:&quot;&lt;p&gt;The Learning Outcomes (CP) of the D3 Informatics Engineering study program refer to SN-Dikti (Minister of Education and Culture Regulation No. 49 of 2014) and have levels in accordance with the Indonesian National Qualifications Framework\/KKNI (Presidential Regulation No. 8 of 2014). Each graduate of the D3 Informatics Engineering study program has the following learning outcomes:&lt;\/p&gt;&quot;,&quot;deskripsi_kurikulum_en&quot;:&quot;&lt;p&gt;The curriculum is a set of courses and educational programs provided by an educational institution which contains lesson plans that will be given to students in one period of education.&lt;\/p&gt;&quot;,&quot;deskripsi_peluang_kerja_en&quot;:&quot;&lt;p&gt;Graduates of the Informatics Engineering Study Program have been successfully absorbed by the business and industrial world, including IT companies, state-owned enterprises, mining companies, manufacturing companies, banks, civil servants, and entrepreneurs. After completing six semesters of study, graduates are expected to be able to fill the following positions:&lt;\/p&gt;&quot;,&quot;website_url&quot;:null,&quot;show_akreditasi&quot;:true,&quot;show_vmts&quot;:true,&quot;show_profil&quot;:true,&quot;show_cpl&quot;:true,&quot;show_capaian&quot;:false,&quot;show_kurikulum&quot;:true,&quot;show_profil_lulusan&quot;:true,&quot;show_fasilitas&quot;:true,&quot;show_dosen&quot;:true,&quot;show_berita&quot;:true,&quot;link_kurikulum&quot;:&quot;https:\/\/drive.usercontent.google.com\/download?id=1AB5DkoQylojpZcIYAm4jdpib0q070Izy&amp;export=download&amp;authuser=2&amp;confirm=t&amp;uuid=7c3457db-bcdb-41a4-ad4a-db9147b83fb8&amp;at=ABswASZnf12dEMiqLhp1athZCk_T:1783625876115&quot;}}]},&quot;url&quot;:&quot;\/dosen\/&quot;,&quot;version&quot;:&quot;&quot;}"></div>    </body>
