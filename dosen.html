pembelajaran dan penelitian di bidang multimedia yang bermutu, akses terbuka, inovatif, relevan dengan kebutuhan industri dan masyarakat.&lt;\/li&gt;\r\n&lt;li&gt;Terwujudnya program studi yang transparan, akuntabel, produktif, dan bermutu.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;sasaran_strategis&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Meningkatnya mutu, akses, relevansi dari layanan, sumberdaya dan output pembelajaran vokasi di bidang multimedia&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya mutu dan relevansi penelitian, publikasi hasil penelitian serta kemampuan penerapan iptek dan inovasi di bidang multimedia.&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya transparansi, akuntabilitas, produktivitas berorientasi kelestarian lingkungan dan mutu layanan, serta tata kelola program studi.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;peo_professional&quot;:&quot;&lt;p&gt;Mampu mengidentifikasi, menganalisis, dan menyelesaikan masalah secara kreatif, inovatif, profesional serta menghasilkan produk serta jasa di bidang multimedia sesuai dengan perkembangan teknologi yang tepat guna dan beretika.&lt;\/p&gt;&quot;,&quot;peo_academic&quot;:&quot;&lt;p&gt;Terlibat dalam kegiatan pengembangan karir profesional dan mempertahankan keunggulan kompetitif dalam pembelajaran seumur hidup melalui pendidikan lebih lanjut, penelitian terapan dan kegiatan profesional lainnya.&lt;\/p&gt;&quot;,&quot;peo_social&quot;:&quot;&lt;p&gt;Memiliki kemampuan komunikasi yang baik, memiliki kepemimpinan dan jiwa kewirausahaan dan mampu berkolaborasi dengan industri dan masyarakat untuk menghasilkan produk dan jasa multimedia&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-06-18T09:22:03.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-18T08:45:57.000000Z&quot;,&quot;deskripsi_peo&quot;:&quot;&lt;p&gt;Program Educational Objective (PEO) atau Profil Profesional Mandiri adalah pernyataan yang secara luas menggambarkan karir dan pencapaian profesional yang dipersiapkan oleh program untuk dicapai lulusan beberapa tahun setelah lulus dari program pendidikan.&lt;\/p&gt;&quot;,&quot;deskripsi_cpl&quot;:&quot;&lt;p&gt;Pemetaan Capaian Pembelajaran Lulusan (CPL) Program Studi Teknologi Rekayasa Multimedia Terhadap CPL IABEE Engineering Technologist&lt;\/p&gt;&quot;,&quot;deskripsi_capaian&quot;:&quot;&lt;p&gt;Capaian Pembelajaran (CP) program studi D4 Teknologi Rekayasa Multimedia telah merujuk pada SN-Dikti (Permendikbud No 49 tahun 2014) dan memiliki level sesuai dengan jenjang Kerangka Kualifikasi Nasional Indonesia\/KKNI (Perpres No.8 Tahun 2014). Setiap lulusan program studi D4 Teknologi Rekayasa Multimedia memiliki capaian pembelajaran sebagai berikut&lt;\/p&gt;&quot;,&quot;deskripsi_kurikulum&quot;:&quot;&lt;p&gt;urikulum adalah perangkat mata kuliah dan program pendidikan yang diberikan oleh suatu lembaga penyelenggara pendidikan yang berisi rancangan pelajaran yang akan diberikan kepada peserta pelajaran dalam satu periode jenjang pendidikan&lt;\/p&gt;&quot;,&quot;deskripsi_peluang_kerja&quot;:&quot;&lt;p&gt;Lulusan Program Studi Teknologi Rekayasa Multimedia, telah berhasil terserap di dunia usaha dan industri, diantaranya perusahaan IT, BUMN, perusahaan pertambangan, perusahaan manufaktur, perbankan, Pegawai Negeri Sipil, dan wirausaha. Setelah mengikuti perkuliahan selama 8 semester, maka diharapkan para lulusan akan dapat menepati posisi kerja sebagai berikut&lt;\/p&gt;&quot;,&quot;akreditasi_gambar&quot;:&quot;program-studi\/akreditasi\/XZNJCYPPs1hm822cHUXroAfKN9wkcj0z7C1Nam1V.png&quot;,&quot;akreditasi_file&quot;:&quot;program-studi\/akreditasi\/0tlOL04p2nQZ8Yal6HGMtIHux38ulTZvBHgJdpjK.pdf&quot;,&quot;logo&quot;:&quot;program-studi\/logo\/DSiNtQaOthXzjDklvHDvbl3WnT3fQQroFG6cupUs.webp&quot;,&quot;logo_sidebar&quot;:&quot;program-studi\/logo\/lJTIOaIN0dbTH2B0NmRFCExOyxpunrAoSfgKh4c0.webp&quot;,&quot;deskripsi_en&quot;:null,&quot;visi_en&quot;:null,&quot;misi_en&quot;:null,&quot;tujuan_en&quot;:null,&quot;sasaran_strategis_en&quot;:null,&quot;peo_professional_en&quot;:null,&q knologi Rekayasa Multimedia&quot;,&quot;slug&quot;:&quot;d4-teknologi-rekayasa-multimedia&quot;,&quot;gambar&quot;:null,&quot;warna_gradient&quot;:&quot;#ffffff,#f05d22&quot;,&quot;deskripsi&quot;:&quot;&lt;p&gt;Program Studi Sarjana Terapan Teknologi Rekayasa Multimedia Politeknik Negeri Batam fokus untuk menyiapkan lulusan yang memiliki kompetensi pada bidang multimedia serta memiliki kemampuan tambahan di bidang informatika untuk menghasilkan karya teknologi yang dapat berguna serta dapat diimplementasikan di dunia industri. Secara umum, mahasiswa prodi Teknologi Rekayasa Multimedia akan menempuh perkuliahan selama 8 semester atau 4 tahun.&lt;\/p&gt;&quot;,&quot;akreditasi&quot;:&quot;Baik Sekali&quot;,&quot;akreditasi_en&quot;:null,&quot;visi&quot;:&quot;&lt;p&gt;Menjadi program studi vokasional yang bermutu, unggul, adaptif, inovatif, dan bermitra erat dengan industri dan masyarakat di bidang multimedia untuk mendukung Indonesia Maju dan Sejahtera 2045.&lt;\/p&gt;&quot;,&quot;misi&quot;:&quot;&lt;p&gt;Aktif dalam proses kreasi, penyebaran dan penerapan sains dan teknologi di bidang multimedia melalui layanan pendidikan tinggi vokasi dan penelitian terapan yang bermutu, terbuka, relevan, dan berkolaborasi erat dengan masyarakat dan industri dengan penerapan tata kelola institusi yang baik untuk kehidupan bangsa yang lebih baik.&lt;\/p&gt;&quot;,&quot;tujuan&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Terwujudnya layanan, sumber daya dan ouput pembelajaran dan penelitian di bidang multimedia yang bermutu, akses terbuka, inovatif, relevan dengan kebutuhan industri dan masyarakat.&lt;\/li&gt;\r\n&lt;li&gt;Terwujudnya program studi yang transparan, akuntabel, produktif, dan bermutu.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;sasaran_strategis&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Meningkatnya mutu, akses, relevansi dari layanan, sumberdaya dan output pembelajaran vokasi di bidang multimedia&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya mutu dan relevansi penelitian, publikasi hasil penelitian serta kemampuan penerapan iptek dan inovasi di bidang multimedia.&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya transparansi, akuntabilitas, produktivitas berorientasi kelestarian lingkungan dan mutu layanan, serta tata kelola program studi.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;peo_professional&quot;:&quot;&lt;p&gt;Mampu mengidentifikasi, menganalisis, dan menyelesaikan masalah secara kreatif, inovatif, profesional serta menghasilkan produk serta jasa di bidang multimedia sesuai dengan perkembangan teknologi yang tepat guna dan beretika.&lt;\/p&gt;&quot;,&quot;peo_academic&quot;:&quot;&lt;p&gt;Terlibat dalam kegiatan pengembangan karir profesional dan mempertahankan keunggulan kompetitif dalam pembelajaran seumur hidup melalui pendidikan lebih lanjut, penelitian terapan dan kegiatan profesional lainnya.&lt;\/p&gt;&quot;,&quot;peo_social&quot;:&quot;&lt;p&gt;Memiliki kemampuan komunikasi yang baik, memiliki kepemimpinan dan jiwa kewirausahaan dan mampu berkolaborasi dengan industri dan masyarakat untuk menghasilkan produk dan jasa multimedia&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-06-18T09:22:03.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-18T08:45:57.000000Z&quot;,&quot;deskripsi_peo&quot;:&quot;&lt;p&gt;Program Educational Objective (PEO) atau Profil Profesional Mandiri adalah pernyataan yang secara luas menggambarkan karir dan pencapaian profesional yang dipersiapkan oleh program untuk dicapai lulusan beberapa tahun setelah lulus dari program pendidikan.&lt;\/p&gt;&quot;,&quot;deskripsi_cpl&quot;:&quot;&lt;p&gt;Pemetaan Capaian Pembelajaran Lulusan (CPL) Program Studi Teknologi Rekayasa Multimedia Terhadap CPL IABEE Engineering Technologist&lt;\/p&gt;&quot;,&quot;deskripsi_capaian&quot;:&quot;&lt;p&gt;Capaian Pembelajaran (CP) program studi D4 Teknologi Rekayasa Multimedia telah merujuk pada SN-Dikti (Permendikbud No 49 tahun 2014) dan memiliki level sesuai dengan jenjang Kerangka Kualifikasi Nasional Indonesia\/KKNI (Perpres No.8 Tahun 2014). Setiap lulusan program studi D4 Teknologi Rekayasa Multimedia memiliki capaian pembelajaran sebagai berikut&lt;\/p&gt;&quot;,&quot;deskripsi_kurikulum&quot;:&quot;&lt;p&gt;urikulum adalah perangkat mata kuliah dan program pendidikan yang diberikan oleh suatu lembaga penyelenggara pendidikan yang berisi rancangan pelajaran yang akan diberikan kepada peserta pelajaran dalam satu periode jenjang pendidikan&lt;\/p&gt;&quot;,&quot;deskripsi_peluang_kerja&quot;:&quot;&lt;p&gt;Lulusan Program Studi Teknologi Rekayasa Multimedia, telah berhasil terserap di dunia usaha dan industri, diantaranya perusahaan IT, BUMN, perusahaan pertambangan, perusahaan manufaktur, perbankan, Pegawai Negeri Sipil, dan wirausaha. Setelah mengikuti perkuliahan selama 8 semester, maka diharapkan para lulusan akan dapat menepati posisi kerja sebagai berikut&lt;\/p&gt;&quot;,&quot;akreditasi_gambar&quot;:&quot;program-studi\/akreditasi\/XZNJCYPPs1hm822cHUXroAfKN9wkcj0z7C1Nam1V.png&quot;,&quot;akreditasi_file&quot;:&quot;program-studi\/akreditasi\/0tlOL04p2nQZ8Yal6HGMtIHux38ulTZvBHgJdpjK.pdf&quot;,&quot;logo&quot;:&quot;program-studi\/logo\/DSiNtQaOthXzjDklvHDvbl3WnT3fQQroFG6cupUs.webp&quot;,&quot;logo_sidebar&quot;:&quot;program-studi\/logo\/lJTIOaIN0dbTH2B0NmRFCExOyxpunrAoSfgKh4c0.webp&quot;,&quot;deskripsi_en&quot;:null,&quot;visi_en&quot;:null,&quot;misi_en&quot;:null,&quot;tujuan_en&quot;:null,&quot;sasaran_strategis_en&quot;:null,&quot;peo_professional_en&quot;:null,&quot;peo_academic_en&quot;:null,&quot;peo_social_en&quot;:null,&quot;deskripsi_peo_en&quot;:null,&quot;deskripsi_cpl_en&quot;:null,&quot;deskripsi_capaian_en&quot;:null,&quot;deskripsi_kurikulum_en&quot;:null,&quot;deskripsi_peluang_kerja_en&quot;:null,&quot;website_url&quot;:&quot;https:\/\/if.polibatam.ac.id\/trm\/&quot;,&quot;show_akreditasi&quot;:true,&quot;show_vmts&quot;:true,&quot;show_profil&quot;:true,&quot;show_cpl&quot;:true,&quot;show_capaian&quot;:false,&quot;show_kurikulum&quot;:true,&quot;show_profil_lulusan&quot;:tru berorientasi kelestarian lingkungan dan mutu layanan, serta tata kelola program studi.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;peo_professional&quot;:&quot;&lt;p&gt;Mampu mengidentifikasi, menganalisis, dan menyelesaikan masalah secara kreatif, inovatif, profesional serta menghasilkan produk serta jasa di bidang multimedia sesuai dengan perkembangan teknologi yang tepat guna dan beretika.&lt;\/p&gt;&quot;,&quot;peo_academic&quot;:&quot;&lt;p&gt;Terlibat dalam kegiatan pengembangan karir profesional dan mempertahankan keunggulan kompetitif dalam pembelajaran seumur hidup melalui pendidikan lebih lanjut, penelitian terapan dan kegiatan profesional lainnya.&lt;\/p&gt;&quot;,&quot;peo_social&quot;:&quot;&lt;p&gt;Memiliki kemampuan komunikasi yang baik, memiliki kepemimpinan dan jiwa kewirausahaan dan mampu berkolaborasi dengan industri dan masyarakat untuk menghasilkan produk dan jasa multimedia&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-06-18T09:22:03.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-18T08:45:57.000000Z&quot;,&quot;deskripsi_peo&quot;:&quot;&lt;p&gt;Program Educational Objective (PEO) atau Profil Profesional Mandiri adalah pernyataan yang secara luas menggambarkan karir dan pencapaian profesional yang dipersiapkan oleh program untuk dicapai lulusan beberapa tahun setelah lulus dari program pendidikan.&lt;\/p&gt;&quot;,&quot;deskripsi_cpl&quot;:&quot;&lt;p&gt;Pemetaan Capaian Pembelajaran Lulusan (CPL) Program Studi Teknologi Rekayasa Multimedia Terhadap CPL IABEE Engineering Technologist&lt;\/p&gt;&quot;,&quot;deskripsi_capaian&quot;:&quot;&lt;p&gt;Capaian Pembelajaran (CP) program studi D4 Teknologi Rekayasa Multimedia telah merujuk pada SN-Dikti (Permendikbud No 49 tahun 2014) dan memiliki level sesuai dengan jenjang Kerangka Kualifikasi Nasional Indonesia\/KKNI (Perpres No.8 Tahun 2014). Setiap lulusan program studi D4 Teknologi Rekayasa Multimedia memiliki capaian pembelajaran sebagai berikut&lt;\/p&gt;&quot;,&quot;deskripsi_kurikulum&quot;:&quot;&lt;p&gt;urikulum adalah perangkat mata kuliah dan program pendidikan yang diberikan oleh suatu lembaga penyelenggara pendidikan yang berisi rancangan pelajaran yang akan diberikan kepada peserta pelajaran dalam satu periode jenjang pendidikan&lt;\/p&gt;&quot;,&quot;deskripsi_peluang_kerja&quot;:&quot;&lt;p&gt;Lulusan Program Studi Teknologi Rekayasa Multimedia, telah berhasil terserap di dunia usaha dan industri, diantaranya perusahaan IT, BUMN, perusahaan pertambangan, perusahaan manufaktur, perbankan, Pegawai Negeri Sipil, dan wirausaha. Setelah mengikuti perkuliahan selama 8 semester, maka diharapkan para lulusan akan dapat menepati posisi kerja sebagai berikut&lt;\/p&gt;&quot;,&quot;akreditasi_gambar&quot;:&quot;program-studi\/akreditasi\/XZNJCYPPs1hm822cHUXroAfKN9wkcj0z7C1Nam1V.png&quot;,&quot;akreditasi_file&quot;:&quot;program-studi\/akreditasi\/0tlOL04p2nQZ8Yal6HGMtIHux38ulTZvBHgJdpjK.pdf&quot;,&quot;logo&quot;:&quot;program-studi\/logo\/DSiNtQaOthXzjDklvHDvbl3WnT3fQQroFG6cupUs.webp&quot;,&quot;logo_sidebar&quot;:&quot;program-studi\/logo\/lJTIOaIN0dbTH2B0NmRFCExOyxpunrAoSfgKh4c0.webp&quot;,&quot;deskripsi_en&quot;:null,&quot;visi_en&quot;:null,&quot;misi_en&quot;:null,&quot;tujuan_en&quot;:null,&quot;sasaran_strategis_en&quot;:null,&quot;peo_professional_en&quot;:null,&quot;peo_academic_en&quot;:null,&quot;peo_social_en&quot;:null,&quot;deskripsi_peo_en&quot;:null,&quot;deskripsi_cpl_en&quot;:null,&quot;deskripsi_capaian_en&quot;:null,&quot;deskripsi_kurikulum_en&quot;:null,&quot;deskripsi_peluang_kerja_en&quot;:null,&quot;website_url&quot;:&quot;https:\/\/if.polibatam.ac.id\/trm\/&quot;,&quot;show_akreditasi&quot;:true,&quot;show_vmts&quot;:true,&quot;show_profil&quot;:true,&quot;show_cpl&quot;:true,&quot;show_capaian&quot;:false,&quot;show_kurikulum&quot;:true,&quot;show_profil_lulusan&quot;:true,&quot;show_fasilitas&quot;:true,&quot;show_dosen&quot;:true,&quot;show_berita&quot;:true,&quot;link_kurikulum&quot;:null}},{&quot;id&quot;:55,&quot;nama elar&quot;:&quot;Magister (S2)&quot;,&quot;tahun&quot;:&quot;2014&quot;,&quot;institusi&quot;:&quot;National Taipei University of Technology&quot;},{&quot;gelar&quot;:&quot;Diploma IV&quot;,&quot;tahun&quot;:&quot;2011&quot;,&quot;institusi&quot;:&quot;Politeknik Elektronika Negeri Surabaya&quot;},{&quot;gelar&quot;:&quot;Diploma III&quot;,&quot;tahun&quot;:&quot;2008&quot;,&quot;institusi&quot;:&quot;Politeknik Elektronika Negeri Surabaya&quot;}],&quot;sosial_media&quot;:[{&quot;url&quot;:&quot;https:\/\/sinta.kemdiktisaintek.go.id\/authors\/profile\/6651107&quot;,&quot;platform&quot;:&quot;Sinta&quot;},{&quot;url&quot;:&quot;https:\/\/orcid.org\/0000-0002-2705-4071&quot;,&quot;platform&quot;:&quot;Scopus&quot;},{&quot;url&quot;:&quot;https:\/\/scholar.google.com\/citations?hl=id&amp;user=JF-fP7kAAAAJ&quot;,&quot;platform&quot;:&quot;Google Scholar&quot;},{&quot;url&quot;:&quot;https:\/\/www.linkedin.com\/in\/mfajriamiruln\/?originalSubdomain=id&quot;,&quot;platform&quot;:&quot;LinkedIn&quot;},{&quot;url&quot;:&quot;https:\/\/www.instagram.com\/fajriamirul\/&quot;,&quot;platform&quot;:&quot;Instagram&quot;}],&quot;jabatan_en&quot;:&quot;Lektor&quot;,&quot;kata_kata_en&quot;:null,&quot;user_id&quot;:45,&quot;program_studi&quot;:{&quot;id&quot;:5,&quot;nama_program&quot;:&quot;D4  Teknologi Rekayasa Multimedia&quot;,&quot;slug&quot;:&quot;d4-teknologi-rekayasa-multimedia&quot;,&quot;gambar&quot;:null,&quot;warna_gradient&quot;:&quot;#ffffff,#f05d22&quot;,&quot;deskripsi&quot;:&quot;&lt;p&gt;Program Studi Sarjana Terapan Teknologi Rekayasa Multimedia Politeknik Negeri Batam fokus untuk menyiapkan lulusan yang memiliki kompetensi pada bidang multimedia serta memiliki kemampuan tambahan di bidang informatika untuk menghasilkan karya teknologi yang dapat berguna serta dapat diimplementasikan di dunia industri. Secara umum, mahasiswa prodi Teknologi Rekayasa Multimedia akan menempuh perkuliahan selama 8 semester atau 4 tahun.&lt;\/p&gt;&quot;,&quot;akreditasi&quot;:&quot;Baik Sekali&quot;,&quot;akreditasi_en&quot;:null,&quot;visi&quot;:&quot;&lt;p&gt;Menjadi program studi vokasional yang bermutu, unggul, adaptif, inovatif, dan bermitra erat dengan industri dan masyarakat di bidang multimedia untuk mendukung Indonesia Maju dan Sejahtera 2045.&lt;\/p&gt;&quot;,&quot;misi&quot;:&quot;&lt;p&gt;Aktif dalam proses kreasi, penyebaran dan penerapan sains dan teknologi di bidang multimedia melalui layanan pendidikan tinggi vokasi dan penelitian terapan yang bermutu, terbuka, relevan, dan berkolaborasi erat dengan masyarakat dan industri dengan penerapan tata kelola institusi yang baik untuk kehidupan bangsa yang lebih baik.&lt;\/p&gt;&quot;,&quot;tujuan&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Terwujudnya layanan, sumber daya dan ouput pembelajaran dan penelitian di bidang multimedia yang bermutu, akses terbuka, inovatif, relevan dengan kebutuhan industri dan masyarakat.&lt;\/li&gt;\r\n&lt;li&gt;Terwujudnya program studi yang transparan, akuntabel, produktif, dan bermutu.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;sasaran_strategis&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Meningkatnya mutu, akses, relevansi dari layanan, sumberdaya dan output pembelajaran vokasi di bidang multimedia&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya mutu dan relevansi penelitian, publikasi hasil penelitian serta kemampuan penerapan iptek dan inovasi di bidang multimedia.&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya transparansi, akuntabilitas, produktivitas berorientasi kelestarian lingkungan dan mutu layanan, serta tata kelola program studi.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;peo_professional&quot;:&quot;&lt;p&gt;Mampu mengidentifikasi, menganalisis, dan menyelesaikan masalah secara kreatif, inovatif, profesional serta menghasilkan produk serta jasa di bidang multimedia sesuai dengan perkembangan teknologi yang tepat guna dan beretika.&lt;\/p&gt;&quot;,&quot;peo_academic&quot;:&quot;&lt;p&gt;Terlibat dalam kegiatan pengembangan karir profesional dan mempertahankan keunggulan kompetitif dalam pembelajaran seumur hidup melalui pendidikan lebih lanjut, penelitian terapan dan kegiatan profesional lainnya.&lt;\/p&gt;&quot;,&quot;peo_social&quot;:&quot;&lt;p&gt;Memiliki kemampuan komunikasi yang baik, memiliki kepemimpinan dan jiwa kewirausahaan dan mampu berkolaborasi dengan industri dan masyarakat untuk menghasilkan produk dan jasa multimedia&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-06-18T09:22:03.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-18T08:45:57.000000Z&quot;,&quot;deskripsi_peo&quot;:&quot;&lt;p&gt;Program Educational Objective (PEO) atau Profil Profesional Mandiri adalah pernyataan yang secara luas menggambarkan karir dan pencapaian profesional yang dipersiapkan oleh program untuk dicapai lulusan beberapa tahun setelah lulus dari program pendidikan.&lt;\/p&gt;&quot;,&quot;deskripsi_cpl&quot;:&quot;&lt;p&gt;Pemetaan Capaian Pembelajaran Lulusan (CPL) Program Studi Teknologi Rekayasa Multimedia Terhadap CPL IABEE Engineering Technologist&lt;\/p&gt;&quot;,&quot;deskripsi_capaian&quot;:&quot;&lt;p&gt;Capaian Pembelajaran (CP) program studi D4 Teknologi Rekayasa Multimedia telah merujuk pada SN-Dikti (Permendikbud No 49 tahun 2014) dan memiliki level sesuai dengan jenjang Kerangka Kualifikasi Nasional Indonesia\/KKNI (Perpres No.8 Tahun 2014). Setiap lulusan program studi D4 Teknologi Rekayasa Multimedia memiliki capaian pembelajaran sebagai berikut&lt;\/p&gt;&quot;,&quot;deskripsi_kurikulum&quot;:&quot;&lt;p&gt;urikulum adalah perangkat mata kuliah dan program pendidikan yang diberikan oleh suatu lembaga penyelenggara pendidikan yang berisi rancangan pelajaran yang akan diberikan kepada peserta pelajaran dalam satu periode jenjang pendidikan&lt;\/p&gt;&quot;,&quot;deskripsi_peluang_kerja&quot;:&quot;&lt;p&gt;Lulusan Program Studi Teknologi Rekayasa Multimedia, telah berhasil terserap di dunia usaha dan industri, diantaranya perusahaan IT, BUMN, perusahaan pertambangan, perusahaan manufaktur, perbankan, Pegawai Negeri Sipil, dan wirausaha. Setelah mengikuti perkuliahan selama 8 semester, maka diharapkan para lulusan akan dapat menepati posisi kerja sebagai berikut&lt;\/p&gt;&quot;,&quot;akreditasi_gambar&quot;:&quot;program-studi\/akreditasi\/XZNJCYPPs1hm822cHUXroAfKN9wkcj0z7C1Nam1V.png&quot;,&quot;akreditasi_file&quot;:&quot;program-studi\/akreditasi\/0tlOL04p2nQZ8Yal6HGMtIHux38ulTZvBHgJdpjK.pdf&quot;,&quot;logo&quot;:&quot;program-studi\/logo\/DSiNtQaOthXzjDklvHDvbl3WnT3fQQroFG6cupUs.webp&quot;,&quot;logo_sidebar&quot;:&quot;program-studi\/logo\/lJTIOaIN0dbTH2B0NmRFCExOyxpunrAoSfgKh4c0.webp&quot;,&quot;deskripsi_en&quot;:null,&quot;visi_en&quot;:null,&quot;misi_en&quot;:null,&quot;tujuan_en&quot;:null,&quot;sasaran_strategis_en&quot;:null,&quot;peo_professional_en&quot;:null,&quot;peo_academic_en&quot;:null,&quot;peo_social_en&quot;:null,&quot;deskripsi_peo_en&quot;:null,&quot;deskripsi_cpl_en&quot;:null,&quot;deskripsi_capaian_en&quot;:null,&quot;deskripsi_kurikulum_en&quot;:null,&quot;deskripsi_peluang_kerja_en&quot;:null,&quot;website_url&quot;:&quot;https:\/\/if.polibatam.ac.id\/trm\/&quot;,&quot;show_akreditasi&quot;:true,&quot;show_vmts&quot;:true,&quot;show_profil&quot;:true,&quot;show_cpl&quot;:true,&quot;show_capaian&quot;:false,&quot;show_kurikulum&quot;:true,&quot;show_profil_lulusan&quot;:true,&quot;show_fasilitas&quot;:true,&quot;show_dosen&quot;:true,&quot;show_berita&quot;:true,&quot;link_kurikulum&quot;:null}},{&quot;id&quot;:59,&quot;nama&quot;:&quot;Ir. Luthfiya Ratna Sari, S.Si., M.T.&quot;,&quot;nidn&quot;:&quot;117196&quot;,&quot;jabatan&quot;:&quot;Dosen&quot;,&quot;kategori&quot;:&quot;Dosen&quot;,&quot;keahlian&quot;:&quot;Aplikasi Sistem Informasi Geografis, Penginderaan Jauh, Kartografi&quot;,&quot;kata_kata&quot;:null,&quot;gambar&quot;:&quot;dosen\/VLbcyQFUwGWS15RxouhqE5Jun3KqOaEpf16njEP9.jpg&quot;,&quot;created_at&quot;:&quot;2026-07-09T08:49:42.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-07-13T07:50:57.000000Z&quot;,&quot;program_studi_id&quot;:6,&quot;n :null,&quot;deskripsi_peo_en&quot;:null,&quot;deskripsi_cpl_en&quot;:null,&quot;deskripsi_capaian_en&quot;:null,&quot;deskripsi_kurikulum_en&quot;:null,&quot;deskripsi_peluang_kerja_en&quot;:null,&quot;website_url&quot;:&quot;https:\/\/if.polibatam.ac.id\/teknik-geomatika\/&quot;,&quot;show_akreditasi&quot;:true,&quot;show_vmts&quot;:true,&quot;show_profil&quot;:true,&quot;show_cpl&quot;:true,&quot;show_capaian&quot;:false,&quot;show_kurikulum&quot;:true,&quot;show_profil_lulusan&quot;:true,&quot;show_fasilitas&quot;:true,&quot;show_dosen&quot;:true,&quot;show_berita&quot;:true,&quot;link_kurikulum&quot;:null}},{&quot;id&quot;:62,&quot;nama&quot;:&quot;Agung Riyadi, S.Si., M.Kom&quot;,&quot;nidn&quot;:&quot;119221&quot;,&quot;jabatan&quot;:&quot;Dosen&quot;,&quot;kategori&quot;:&quot;Dosen&quot;,&quot;keahlian&quot;:&quot;Artificial Intelligence&quot;,&quot;kata_kata&quot;:null,&quot;gambar&quot;:&quot;dosen\/Fznb2SNyJJw9K0mDudldIcKDixicBT1PBjXxesWc.jpg&quot;,&quot;created_at&quot;:&quot;2026-07-09T08:49:42.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-07-13T08:06:39.000000Z&quot;,&quot;program_studi_id&quot;:5,&quot;nik&quot;:&quot;119221&quot;,&quot;pendidikan_terakhir&quot;:&quot;Magister Strata 2 (S2)&quot;,&quot;email&quot;:&quot;agung@polibatam.ac.id&quot;,&quot;riwayat_pendidikan&quot;:[{&quot;gelar&quot;:&quot;Sarjana (S1) Universitas Negeri Jakarta : Fisika&quot;,&quot;tahun&quot;:null,&quot;institusi&quot;:null},{&quot;gelar&quot;:&quot;Magister (S2) Universitas Budiluhur : Ilmu Komputer&quot;,&quot;tahun&quot;:null,&quot;institusi&quot;:null}],&quot;sosial_media&quot;:[{&quot;url&quot;:&quot;https:\/\/sinta.kemdikbud.go.id\/authors\/profile\/&quot;,&quot;platform&quot;:&quot;Sinta&quot;},{&quot;url&quot;:&quot;https:\/\/orcid.org\/&quot;,&quot;platform&quot;:&quot;Scopus&quot;},{&quot;url&quot;:&quot;https:\/\/twitter.com\/&quot;,&quot;platform&quot;:&quot;Twitter&quot;},{&quot;url&quot;:&quot;https:\/\/facebook.com\/&quot;,&quot;platform&quot;:&quot;Facebook&quot;},{&quot;url&quot;:&quot;https:\/\/linkedin.com\/in\/&quot;,&quot;platform&quot;:&quot;Linkedin&quot;},{&quot;url&quot;:&quot;https:\/\/instagram.com\/&quot;,&quot;platform&quot;:&quot;Instagram&quot;}],&quot;jabatan_en&quot;:null,&quot;kata_kata_en&quot;:null,&quot;user_id&quot;:50,&quot;program_studi&quot;:{&quot;id&quot;:5,&quot;nama_program&quot;:&quot;D4  Teknologi Rekayasa Multimedia&quot;,&quot;slug&quot;:&quot;d4-teknologi-rekayasa-multimedia&quot;,&quot;gambar&quot;:null,&quot;warna_gradient&quot;:&quot;#ffffff,#f05d22&quot;,&quot;deskripsi&quot;:&quot;&lt;p&gt;Program Studi Sarjana Terapan Teknologi Rekayasa Multimedia Politeknik Negeri Batam fokus untuk menyiapkan lulusan yang memiliki kompetensi pada bidang multimedia serta memiliki kemampuan tambahan di bidang informatika untuk menghasilkan karya teknologi yang dapat berguna serta dapat diimplementasikan di dunia industri. Secara umum, mahasiswa prodi Teknologi Rekayasa Multimedia akan menempuh perkuliahan selama 8 semester atau 4 tahun.&lt;\/p&gt;&quot;,&quot;akreditasi&quot;:&quot;Baik Sekali&quot;,&quot;akreditasi_en&quot;:null,&quot;visi&quot;:&quot;&lt;p&gt;Menjadi program studi vokasional yang bermutu, unggul, adaptif, inovatif, dan bermitra erat dengan industri dan masyarakat di bidang multimedia untuk mendukung Indonesia Maju dan Sejahtera 2045.&lt;\/p&gt;&quot;,&quot;misi&quot;:&quot;&lt;p&gt;Aktif dalam proses kreasi, penyebaran dan penerapan sains dan teknologi di bidang multimedia melalui layanan pendidikan tinggi vokasi dan penelitian terapan yang bermutu, terbuka, relevan, dan berkolaborasi erat dengan masyarakat dan industri dengan penerapan tata kelola institusi yang baik untuk kehidupan bangsa yang lebih baik.&lt;\/p&gt;&quot;,&quot;tujuan&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Terwujudnya layanan, sumber daya dan ouput pembelajaran dan penelitian di bidang multimedia yang bermutu, akses terbuka, inovatif, relevan dengan kebutuhan industri dan masyarakat.&lt;\/li&gt;\r\n&lt;li&gt;Terwujudnya program studi yang transparan, akuntabel, produktif, dan bermutu.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;sasaran_strategis&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Meningkatnya mutu, akses, relevansi dari layanan, sumberdaya dan output pembelajaran vokasi di bidang multimedia&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya mutu dan relevansi penelitian, publikasi hasil penelitian serta kemampuan penerapan iptek dan inovasi di bidang multimedia.&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya transparansi, akuntabilitas, produktivitas berorientasi kelestarian lingkungan dan mutu layanan, serta tata kelola program studi.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;peo_professional&quot;:&quot;&lt;p&gt;Mampu mengidentifikasi, menganalisis, dan menyelesaikan masalah secara kreatif, inovatif, profesional serta menghasilkan produk serta jasa di bidang multimedia sesuai dengan perkembangan teknologi yang tepat guna dan beretika.&lt;\/p&gt;&quot;,&quot;peo_academic&quot;:&quot;&lt;p&gt;Terlibat dalam kegiatan pengembangan karir profesional dan mempertahankan keunggulan kompetitif dalam pembelajaran seumur hidup melalui pendidikan lebih lanjut, penelitian terapan dan kegiatan profesional lainnya.&lt;\/p&gt;&quot;,&quot;peo_social&quot;:&quot;&lt;p&gt;Memiliki kemampuan komunikasi yang baik, memiliki kepemimpinan dan jiwa kewirausahaan dan mampu berkolaborasi dengan industri dan masyarakat untuk menghasilkan produk dan jasa multimedia&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-06-18T09:22:03.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-18T08:45:57.000000Z&quot;,&quot;deskripsi_peo&quot;:&quot;&lt;p&gt;Program Educational Objective (PEO) atau Profil Profesional Mandiri adalah pernyataan yang secara luas menggambarkan karir dan pencapaian profesional yang dipersiapkan oleh program untuk dicapai lulusan beberapa tahun setelah lulus dari program pendidikan.&lt;\/p&gt;&quot;,&quot;deskripsi_cpl&quot;:&quot;&lt;p&gt;Pemetaan Capaian Pembelajaran Lulusan (CPL) Program Studi Teknologi Rekayasa Multimedia Terhadap CPL IABEE Engineering Technologist&lt;\/p&gt;&quot;,&quot;deskripsi_capaian&quot;:&quot;&lt;p&gt;Capaian Pembelajaran (CP) program studi D4 Teknologi Rekayasa Multimedia telah merujuk pada SN-Dikti (Permendikbud No 49 tahun 2014) dan memiliki level sesuai dengan jenjang Kerangka Kualifikasi Nasional Indonesia\/KKNI (Perpres No.8 Tahun 2014). Setiap lulusan program studi D4 Teknologi Rekayasa Multimedia memiliki capaian pembelajaran sebagai berikut&lt;\/p&gt;&quot;,&quot;deskripsi_kurikulum&quot;:&quot;&lt;p&gt;urikulum adalah perangkat mata kuliah dan program pendidikan yang diberikan oleh suatu lembaga penyelenggara pendidikan yang berisi rancangan pelajaran yang akan diberikan kepada peserta pelajaran dalam satu periode jenjang pendidikan&lt;\/p&gt;&quot;,&quot;deskripsi_peluang_kerja&quot;:&quot;&lt;p&gt;Lulusan Program Studi Teknologi Rekayasa Multimedia, telah berhasil terserap di dunia usaha dan industri, diantaranya perusahaan IT, BUMN, perusahaan pertambangan, perusahaan manufaktur, perbankan, Pegawai Negeri Sipil, dan wirausaha. Setelah mengikuti perkuliahan selama 8 semester, maka diharapkan para lulusan akan dapat menepati posisi kerja sebagai berikut&lt;\/p&gt;&quot;,&quot;akreditasi_gambar&quot;:&quot;program-studi\/akreditasi\/XZNJCYPPs1hm822cHUXroAfKN9wkcj0z7C1Nam1V.png&quot;,&quot;akreditasi_file&quot;:&quot;program-studi\/akreditasi\/0tlOL04p2nQZ8Yal6HGMtIHux38ulTZvBHgJdpjK.pdf&quot;,&quot;logo&quot;:&quot;program-studi\/logo\/DSiNtQaOthXzjDklvHDvbl3WnT3fQQroFG6cupUs.webp&quot;,&quot;logo_sidebar&quot;:&quot;program-studi\/logo\/lJTIOaIN0dbTH2B0NmRFCExOyxpunrAoSfgKh4c0.webp&quot;,&quot;deskripsi_en&quot;:null,&quot;visi_en&quot;:null,&quot;misi_en&quot;:null,&quot;tujuan_en&quot;:null,&quot;sasaran_strategis_en&quot;:null,&quot;peo_professional_en&quot;:null,&quot;peo_academic_en&quot;:null,&quot;peo_social_en&quot;:null,&quot;deskripsi_peo_en&quot;:null,&quot;deskripsi_cpl_en&quot;:null,&quot;deskripsi_capaian_en&quo uot;nama_program&quot;:&quot;D4  Teknologi Rekayasa Multimedia&quot;,&quot;slug&quot;:&quot;d4-teknologi-rekayasa-multimedia&quot;,&quot;gambar&quot;:null,&quot;warna_gradient&quot;:&quot;#ffffff,#f05d22&quot;,&quot;deskripsi&quot;:&quot;&lt;p&gt;Program Studi Sarjana Terapan Teknologi Rekayasa Multimedia Politeknik Negeri Batam fokus untuk menyiapkan lulusan yang memiliki kompetensi pada bidang multimedia serta memiliki kemampuan tambahan di bidang informatika untuk menghasilkan karya teknologi yang dapat berguna serta dapat diimplementasikan di dunia industri. Secara umum, mahasiswa prodi Teknologi Rekayasa Multimedia akan menempuh perkuliahan selama 8 semester atau 4 tahun.&lt;\/p&gt;&quot;,&quot;akreditasi&quot;:&quot;Baik Sekali&quot;,&quot;akreditasi_en&quot;:null,&quot;visi&quot;:&quot;&lt;p&gt;Menjadi program studi vokasional yang bermutu, unggul, adaptif, inovatif, dan bermitra erat dengan industri dan masyarakat di bidang multimedia untuk mendukung Indonesia Maju dan Sejahtera 2045.&lt;\/p&gt;&quot;,&quot;misi&quot;:&quot;&lt;p&gt;Aktif dalam proses kreasi, penyebaran dan penerapan sains dan teknologi di bidang multimedia melalui layanan pendidikan tinggi vokasi dan penelitian terapan yang bermutu, terbuka, relevan, dan berkolaborasi erat dengan masyarakat dan industri dengan penerapan tata kelola institusi yang baik untuk kehidupan bangsa yang lebih baik.&lt;\/p&gt;&quot;,&quot;tujuan&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Terwujudnya layanan, sumber daya dan ouput pembelajaran dan penelitian di bidang multimedia yang bermutu, akses terbuka, inovatif, relevan dengan kebutuhan industri dan masyarakat.&lt;\/li&gt;\r\n&lt;li&gt;Terwujudnya program studi yang transparan, akuntabel, produktif, dan bermutu.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;sasaran_strategis&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Meningkatnya mutu, akses, relevansi dari layanan, sumberdaya dan output pembelajaran vokasi di bidang multimedia&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya mutu dan relevansi penelitian, publikasi hasil penelitian serta kemampuan penerapan iptek dan inovasi di bidang multimedia.&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya transparansi, akuntabilitas, produktivitas berorientasi kelestarian lingkungan dan mutu layanan, serta tata kelola program studi.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;peo_professional&quot;:&quot;&lt;p&gt;Mampu mengidentifikasi, menganalisis, dan menyelesaikan masalah secara kreatif, inovatif, profesional serta menghasilkan produk serta jasa di bidang multimedia sesuai dengan perkembangan teknologi yang tepat guna dan beretika.&lt;\/p&gt;&quot;,&quot;peo_academic&quot;:&quot;&lt;p&gt;Terlibat dalam kegiatan pengembangan karir profesional dan mempertahankan keunggulan kompetitif dalam pembelajaran seumur hidup melalui pendidikan lebih lanjut, penelitian terapan dan kegiatan profesional lainnya.&lt;\/p&gt;&quot;,&quot;peo_social&quot;:&quot;&lt;p&gt;Memiliki kemampuan komunikasi yang baik, memiliki kepemimpinan dan jiwa kewirausahaan dan mampu berkolaborasi dengan industri dan masyarakat untuk menghasilkan produk dan jasa multimedia&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-06-18T09:22:03.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-18T08:45:57.000000Z&quot;,&quot;deskripsi_peo&quot;:&quot;&lt;p&gt;Program Educational Objective (PEO) atau Profil Profesional Mandiri adalah pernyataan yang secara luas menggambarkan karir dan pencapaian profesional yang dipersiapkan oleh program untuk dicapai lulusan beberapa tahun setelah lulus dari program pendidikan.&lt;\/p&gt;&quot;,&quot;deskripsi_cpl&quot;:&quot;&lt;p&gt;Pemetaan Capaian Pembelajaran Lulusan (CPL) Program Studi Teknologi Rekayasa Multimedia Terhadap CPL IABEE Engineering Technologist&lt;\/p&gt;&quot;,&quot;deskripsi_capaian&quot;:&quot;&lt;p&gt;Capaian Pembelajaran (CP) program studi D4 Teknologi Rekayasa Multimedia telah merujuk pada SN-Dikti (Permendikbud No 49 tahun 2014) dan memiliki level sesuai dengan jenjang Kerangka Kualifikasi Nasional Indonesia\/KKNI (Perpres No.8 Tahun 2014). Setiap lulusan program studi D4 Teknologi Rekayasa Multimedia memiliki capaian pembelajaran sebagai berikut&lt;\/p&gt;&quot;,&quot;deskripsi_kurikulum&quot;:&quot;&lt;p&gt;urikulum adalah perangkat mata kuliah dan program pendidikan yang diberikan oleh suatu lembaga penyelenggara pendidikan yang berisi rancangan pelajaran yang akan diberikan kepada peserta pelajaran dalam satu periode jenjang pendidikan&lt;\/p&gt;&quot;,&quot;deskripsi_peluang_kerja&quot;:&quot;&lt;p&gt;Lulusan Program Studi Teknologi Rekayasa Multimedia, telah berhasil terserap di dunia usaha dan industri, diantaranya perusahaan IT, BUMN, perusahaan pertambangan, perusahaan manufaktur, perbankan, Pegawai Negeri Sipil, dan wirausaha. Setelah mengikuti perkuliahan selama 8 semester, maka diharapkan para lulusan akan dapat menepati posisi kerja sebagai berikut&lt;\/p&gt;&quot;,&quot;akreditasi_gambar&quot;:&quot;program-studi\/akreditasi\/XZNJCYPPs1hm822cHUXroAfKN9wkcj0z7C1Nam1V.png&quot;,&quot;akreditasi_file&quot;:&quot;program-studi\/akreditasi\/0tlOL04p2nQZ8Yal6HGMtIHux38ulTZvBHgJdpjK.pdf&quot;,&quot;logo&quot;:&quot;program-studi\/logo\/DSiNtQaOthXzjDklvHDvbl3WnT3fQQroFG6cupUs.webp&quot;,&quot;logo_sidebar&quot;:&quot;program-studi\/logo\/lJTIOaIN0dbTH2B0NmRFCExOyxpunrAoSfgKh4c0.webp&quot;,&quot;deskripsi_en&quot;:null,&quot;visi_en&quot;:null,&quot;misi_en&quot;:null,&quot;tujuan_en&quot;:null,&quot;sasaran_strategis_en&quot;:null,&quot;peo_professional_en&quot;:null,&quot;peo_academic_en&quot;:null,&quot;peo_social_en&quot;:null,&quot;deskripsi_peo_en&quot;:null,&quot;deskripsi_cpl_en&quot;:null,&quot;deskripsi_capaian_en&quot;:null,&quot;deskripsi_kurikulum_en&quot;:null,&quot;deskripsi_peluang_kerja_en&quot;:null,&quot;website_url&quot;:&quot;https:\/\/if.polibatam.ac.id\/trm\/&quot;,&quot;show_akreditasi&quot;:true,&quot;show_vmts&quot;:true,&quot;show_profil&quot;:true,&quot;show_cpl&quot;:true,&quot;show_capaian&quot;:false,&quot;show_kurikulum&quot;:true, asa-perangkat-lunak\/index.php?page=kurikulum&quot;}},{&quot;id&quot;:67,&quot;nama&quot;:&quot;Aragani Timur Kanistren. S.Sn ., M.Sn&quot;,&quot;nidn&quot;:&quot;122258&quot;,&quot;jabatan&quot;:&quot;Dosen&quot;,&quot;kategori&quot;:&quot;Dosen&quot;,&quot;keahlian&quot;:&quot;Naskah produksi, Ide kreatif, Broadcasting&quot;,&quot;kata_kata&quot;:null,&quot;gambar&quot;:&quot;dosen\/pBkFcyX1U7eSWAQkRe2EPE5FBYUqLFdINPOzht3p.jpg&quot;,&quot;created_at&quot;:&quot;2026-07-09T08:49:43.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-07-13T07:52:19.000000Z&quot;,&quot;program_studi_id&quot;:5,&quot;nik&quot;:&quot;122258&quot;,&quot;pendidikan_terakhir&quot;:&quot;Magister Strata 2 (S2)&quot;,&quot;email&quot;:&quot;aragani@polibatam.ac.id&quot;,&quot;riwayat_pendidikan&quot;:[{&quot;gelar&quot;:&quot;Sarjana (S1) Institut Seni Indonesia : Fakultas Seni Media Rekam, jurusan Televisi&quot;,&quot;tahun&quot;:null,&quot;institusi&quot;:null},{&quot;gelar&quot;:&quot;Magister (S2) Pascasarjana ISI Yogyakarta : Fakultas Seni Media Rekam, jurusan Videografi&quot;,&quot;tahun&quot;:null,&quot;institusi&quot;:null}],&quot;sosial_media&quot;:[{&quot;url&quot;:&quot;https:\/\/sinta.kemdikbud.go.id\/authors\/profile\/&quot;,&quot;platform&quot;:&quot;Sinta&quot;},{&quot;url&quot;:&quot;https:\/\/orcid.org\/&quot;,&quot;platform&quot;:&quot;Scopus&quot;},{&quot;url&quot;:&quot;https:\/\/twitter.com\/&quot;,&quot;platform&quot;:&quot;Twitter&quot;},{&quot;url&quot;:&quot;https:\/\/facebook.com\/&quot;,&quot;platform&quot;:&quot;Facebook&quot;},{&quot;url&quot;:&quot;https:\/\/linkedin.com\/in\/&quot;,&quot;platform&quot;:&quot;Linkedin&quot;},{&quot;url&quot;:&quot;https:\/\/instagram.com\/&quot;,&quot;platform&quot;:&quot;Instagram&quot;}],&quot;jabatan_en&quot;:null,&quot;kata_kata_en&quot;:null,&quot;user_id&quot;:58,&quot;program_studi&quot;:{&quot;id&quot;:5,&quot;nama_program&quot;:&quot;D4  Teknologi Rekayasa Multimedia&quot;,&quot;slug&quot;:&quot;d4-teknologi-rekayasa-multimedia&quot;,&quot;gambar&quot;:null,&quot;warna_gradient&quot;:&quot;#ffffff,#f05d22&quot;,&quot;deskripsi&quot;:&quot;&lt;p&gt;Program Studi Sarjana Terapan Teknologi Rekayasa Multimedia Politeknik Negeri Batam fokus untuk menyiapkan lulusan yang memiliki kompetensi pada bidang multimedia serta memiliki kemampuan tambahan di bidang informatika untuk menghasilkan karya teknologi yang dapat berguna serta dapat diimplementasikan di dunia industri. Secara umum, mahasiswa prodi Teknologi Rekayasa Multimedia akan menempuh perkuliahan selama 8 semester atau 4 tahun.&lt;\/p&gt;&quot;,&quot;akreditasi&quot;:&quot;Baik Sekali&quot;,&quot;akreditasi_en&quot;:null,&quot;visi&quot;:&quot;&lt;p&gt;Menjadi program studi vokasional yang bermutu, unggul, adaptif, inovatif, dan bermitra erat dengan industri dan masyarakat di bidang multimedia untuk mendukung Indonesia Maju dan Sejahtera 2045.&lt;\/p&gt;&quot;,&quot;misi&quot;:&quot;&lt;p&gt;Aktif dalam proses kreasi, penyebaran dan penerapan sains dan teknologi di bidang multimedia melalui layanan pendidikan tinggi vokasi dan penelitian terapan yang bermutu, terbuka, relevan, dan berkolaborasi erat dengan masyarakat dan industri dengan penerapan tata kelola institusi yang baik untuk kehidupan bangsa yang lebih baik.&lt;\/p&gt;&quot;,&quot;tujuan&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Terwujudnya layanan, sumber daya dan ouput pembelajaran dan penelitian di bidang multimedia yang bermutu, akses terbuka, inovatif, relevan dengan kebutuhan industri dan masyarakat.&lt;\/li&gt;\r\n&lt;li&gt;Terwujudnya program studi yang transparan, akuntabel, produktif, dan bermutu.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;sasaran_strategis&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Meningkatnya mutu, akses, relevansi dari layanan, sumberdaya dan output pembelajaran vokasi di bidang multimedia&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya mutu dan relevansi penelitian, publikasi hasil penelitian serta kemampuan penerapan iptek dan inovasi di bidang multimedia.&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya transparansi, akuntabilitas, produktivitas berorientasi kelestarian lingkungan dan mutu layanan, serta tata kelola program studi.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;peo_professional&quot;:&quot;&lt;p&gt;Mampu mengidentifikasi, menganalisis, dan menyelesaikan masalah secara kreatif, inovatif, profesional serta menghasilkan produk serta jasa di bidang multimedia sesuai dengan perkembangan teknologi yang tepat guna dan beretika.&lt;\/p&gt;&quot;,&quot;peo_academic&quot;:&quot;&lt;p&gt;Terlibat dalam kegiatan pengembangan karir profesional dan mempertahankan keunggulan kompetitif dalam pembelajaran seumur hidup melalui pendidikan lebih lanjut, penelitian terapan dan kegiatan profesional lainnya.&lt;\/p&gt;&quot;,&quot;peo_social&quot;:&quot;&lt;p&gt;Memiliki kemampuan komunikasi yang baik, memiliki kepemimpinan dan jiwa kewirausahaan dan mampu berkolaborasi dengan industri dan masyarakat untuk menghasilkan produk dan jasa multimedia&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-06-18T09:22:03.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-18T08:45:57.000000Z&quot;,&quot;deskripsi_peo&quot;:&quot;&lt;p&gt;Program Educational Objective (PEO) atau Profil Profesional Mandiri adalah pernyataan yang secara luas menggambarkan karir dan pencapaian profesional yang dipersiapkan oleh program untuk dicapai lulusan beberapa tahun setelah lulus dari program pendidikan.&lt;\/p&gt;&quot;,&quot;deskripsi_cpl&quot;:&quot;&lt;p&gt;Pemetaan Capaian Pembelajaran Lulusan (CPL) Program Studi Teknologi Rekayasa Multimedia Terhadap CPL IABEE Engineering Technologist&lt;\/p&gt;&quot;,&quot;deskripsi_capaian&quot;:&quot;&lt;p&gt;Capaian Pembelajaran (CP) program studi D4 Teknologi Rekayasa Multimedia telah merujuk pada SN-Dikti (Permendikbud No 49 tahun 2014) dan memiliki level sesuai dengan jenjang Kerangka Kualifikasi Nasional Indonesia\/KKNI (Perpres No.8 Tahun 2014). Setiap lulusan program studi D4 Teknologi Rekayasa Multimedia memiliki capaian pembelajaran sebagai berikut&lt;\/p&gt;&quot;,&quot;deskripsi_kurikulum&quot;:&quot;&lt;p&gt;urikulum adalah perangkat mata kuliah dan program pendidikan yang diberikan oleh suatu lembaga penyelenggara pendidikan yang berisi rancangan pelajaran yang akan diberikan kepada peserta pelajaran dalam satu periode jenjang pendidikan&lt;\/p&gt;&quot;,&quot;deskripsi_peluang_kerja&quot;:&quot;&lt;p&gt;Lulusan Program Studi Teknologi Rekayasa Multimedia, telah berhasil terserap di dunia usaha dan industri, diantaranya perusahaan IT, BUMN, perusahaan pertambangan, perusahaan manufaktur, perbankan, Pegawai Negeri Sipil, dan wirausaha. Setelah mengikuti perkuliahan selama 8 semester, maka diharapkan para lulusan akan dapat menepati posisi kerja sebagai berikut&lt;\/p&gt;&quot;,&quot;akreditasi_gambar&quot;:&quot;program-studi\/akreditasi\/XZNJCYPPs1hm822cHUXroAfKN9wkcj0z7C1Nam1V.png&quot;,&quot;akreditasi_file&quot;:&quot;program-studi\/akreditasi\/0tlOL04p2nQZ8Yal6HGMtIHux38ulTZvBHgJdpjK.pdf&quot;,&quot;logo&quot;:&quot;program-studi\/logo\/DSiNtQaOthXzjDklvHDvbl3WnT3fQQroFG6cupUs.webp&quot;,&quot;logo_sidebar&quot;:&quot;program-studi\/logo\/lJTIOaIN0dbTH2B0NmRFCExOyxpunrAoSfgKh4c0.webp&quot;,&quot;deskripsi_en&quot;:null,&quot;visi_en&quot;:null,&quot;misi_en&quot;:null,&quot;tujuan_en&quot;:null,&quot;sasaran_strategis_en&quot;:null,&quot;peo_professional_en&quot;:null,&quot;peo_academic_en&quot;:null,&quot;peo_social_en&quot;:null,&quot;deskripsi_peo_en&quot;:null,&quot;deskripsi_cpl_en&quot;:null,&quot;deskripsi_capaian_en&quot;:null,&quot;deskripsi_kurikulum_en&quot;:null,&quot;deskripsi_peluang_kerja_en&quot;:null,&quot;website_url&quot;:&quot;https:\/\/if.polibatam.ac.id\/trm\/&quot;,&quot;show_akreditasi&quot;:true,&quot;show_vmts&quot;:true,&quot;show_profil&quot;:true,&quot;show_cpl&quot;:true,&quot;show_capaian&quot;:false,&quot;show_kurikulum&quot;:true,&quot;show_profil_lulusan&quot;:true,&quot;show_fasilitas&quot;:true,&quot;show_dosen&quot;:true,&quot;show_berita&quot ak\/index.php?page=kurikulum&quot;}},{&quot;id&quot;:72,&quot;nama&quot;:&quot;Rini Amadia, S.Sn.,M.Sn&quot;,&quot;nidn&quot;:&quot;122256&quot;,&quot;jabatan&quot;:&quot;Dosen&quot;,&quot;kategori&quot;:&quot;Dosen&quot;,&quot;keahlian&quot;:&quot;Desain Komunikasi Visual&quot;,&quot;kata_kata&quot;:null,&quot;gambar&quot;:&quot;dosen\/Ewrv9yJ40qrO0Q0v76gx1LMzB7ijLD6sMvs8SBEZ.jpg&quot;,&quot;created_at&quot;:&quot;2026-07-09T08:49:44.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-07-13T07:52:08.000000Z&quot;,&quot;program_studi_id&quot;:5,&quot;nik&quot;:&quot;122256&quot;,&quot;pendidikan_terakhir&quot;:&quot;Magister Strata 2 (S2)&quot;,&quot;email&quot;:&quot;riniamadia@polibatam.ac.id&quot;,&quot;riwayat_pendidikan&quot;:[{&quot;gelar&quot;:&quot;Sarjana (S1) Institut Seni Indonesia Padangpanjang&quot;,&quot;tahun&quot;:null,&quot;institusi&quot;:null},{&quot;gelar&quot;:&quot;Magister (S2) Institut Seni Indonesia Padangpanjang&quot;,&quot;tahun&quot;:null,&quot;institusi&quot;:null}],&quot;sosial_media&quot;:[{&quot;url&quot;:&quot;https:\/\/sinta.kemdikbud.go.id\/authors\/profile\/&quot;,&quot;platform&quot;:&quot;Sinta&quot;},{&quot;url&quot;:&quot;https:\/\/orcid.org\/&quot;,&quot;platform&quot;:&quot;Scopus&quot;},{&quot;url&quot;:&quot;https:\/\/twitter.com\/&quot;,&quot;platform&quot;:&quot;Twitter&quot;},{&quot;url&quot;:&quot;https:\/\/facebook.com\/&quot;,&quot;platform&quot;:&quot;Facebook&quot;},{&quot;url&quot;:&quot;https:\/\/linkedin.com\/in\/&quot;,&quot;platform&quot;:&quot;Linkedin&quot;},{&quot;url&quot;:&quot;https:\/\/instagram.com\/&quot;,&quot;platform&quot;:&quot;Instagram&quot;}],&quot;jabatan_en&quot;:null,&quot;kata_kata_en&quot;:null,&quot;user_id&quot;:63,&quot;program_studi&quot;:{&quot;id&quot;:5,&quot;nama_program&quot;:&quot;D4  Teknologi Rekayasa Multimedia&quot;,&quot;slug&quot;:&quot;d4-teknologi-rekayasa-multimedia&quot;,&quot;gambar&quot;:null,&quot;warna_gradient&quot;:&quot;#ffffff,#f05d22&quot;,&quot;deskripsi&quot;:&quot;&lt;p&gt;Program Studi Sarjana Terapan Teknologi Rekayasa Multimedia Politeknik Negeri Batam fokus untuk menyiapkan lulusan yang memiliki kompetensi pada bidang multimedia serta memiliki kemampuan tambahan di bidang informatika untuk menghasilkan karya teknologi yang dapat berguna serta dapat diimplementasikan di dunia industri. Secara umum, mahasiswa prodi Teknologi Rekayasa Multimedia akan menempuh perkuliahan selama 8 semester atau 4 tahun.&lt;\/p&gt;&quot;,&quot;akreditasi&quot;:&quot;Baik Sekali&quot;,&quot;akreditasi_en&quot;:null,&quot;visi&quot;:&quot;&lt;p&gt;Menjadi program studi vokasional yang bermutu, unggul, adaptif, inovatif, dan bermitra erat dengan industri dan masyarakat di bidang multimedia untuk mendukung Indonesia Maju dan Sejahtera 2045.&lt;\/p&gt;&quot;,&quot;misi&quot;:&quot;&lt;p&gt;Aktif dalam proses kreasi, penyebaran dan penerapan sains dan teknologi di bidang multimedia melalui layanan pendidikan tinggi vokasi dan penelitian terapan yang bermutu, terbuka, relevan, dan berkolaborasi erat dengan masyarakat dan industri dengan penerapan tata kelola institusi yang baik untuk kehidupan bangsa yang lebih baik.&lt;\/p&gt;&quot;,&quot;tujuan&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Terwujudnya layanan, sumber daya dan ouput pembelajaran dan penelitian di bidang multimedia yang bermutu, akses terbuka, inovatif, relevan dengan kebutuhan industri dan masyarakat.&lt;\/li&gt;\r\n&lt;li&gt;Terwujudnya program studi yang transparan, akuntabel, produktif, dan bermutu.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;sasaran_strategis&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Meningkatnya mutu, akses, relevansi dari layanan, sumberdaya dan output pembelajaran vokasi di bidang multimedia&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya mutu dan relevansi penelitian, publikasi hasil penelitian serta kemampuan penerapan iptek dan inovasi di bidang multimedia.&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya transparansi, akuntabilitas, produktivitas berorientasi kelestarian lingkungan dan mutu layanan, serta tata kelola program studi.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;peo_professional&quot;:&quot;&lt;p&gt;Mampu mengidentifikasi, menganalisis, dan menyelesaikan masalah secara kreatif, inovatif, profesional serta menghasilkan produk serta jasa di bidang multimedia sesuai dengan perkembangan teknologi yang tepat guna dan beretika.&lt;\/p&gt;&quot;,&quot;peo_academic&quot;:&quot;&lt;p&gt;Terlibat dalam kegiatan pengembangan karir profesional dan mempertahankan keunggulan kompetitif dalam pembelajaran seumur hidup melalui pendidikan lebih lanjut, penelitian terapan dan kegiatan profesional lainnya.&lt;\/p&gt;&quot;,&quot;peo_social&quot;:&quot;&lt;p&gt;Memiliki kemampuan komunikasi yang baik, memiliki kepemimpinan dan jiwa kewirausahaan dan mampu berkolaborasi dengan industri dan masyarakat untuk menghasilkan produk dan jasa multimedia&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-06-18T09:22:03.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-18T08:45:57.000000Z&quot;,&quot;deskripsi_peo&quot;:&quot;&lt;p&gt;Program Educational Objective (PEO) atau Profil Profesional Mandiri adalah pernyataan yang secara luas menggambarkan karir dan pencapaian profesional yang dipersiapkan oleh program untuk dicapai lulusan beberapa tahun setelah lulus dari program pendidikan.&lt;\/p&gt;&quot;,&quot;deskripsi_cpl&quot;:&quot;&lt;p&gt;Pemetaan Capaian Pembelajaran Lulusan (CPL) Program Studi Teknologi Rekayasa Multimedia Terhadap CPL IABEE Engineering Technologist&lt;\/p&gt;&quot;,&quot;deskripsi_capaian&quot;:&quot;&lt;p&gt;Capaian Pembelajaran (CP) program studi D4 Teknologi Rekayasa Multimedia telah merujuk pada SN-Dikti (Permendikbud No 49 tahun 2014) dan memiliki level sesuai dengan jenjang Kerangka Kualifikasi Nasional Indonesia\/KKNI (Perpres No.8 Tahun 2014). Setiap lulusan program studi D4 Teknologi Rekayasa Multimedia memiliki capaian pembelajaran sebagai berikut&lt;\/p&gt;&quot;,&quot;deskripsi_kurikulum&quot;:&quot;&lt;p&gt;urikulum adalah perangkat mata kuliah dan program pendidikan yang diberikan oleh suatu lembaga penyelenggara pendidikan yang berisi rancangan pelajaran yang akan diberikan kepada peserta pelajaran dalam satu periode jenjang pendidikan&lt;\/p&gt;&quot;,&quot;deskripsi_peluang_kerja&quot;:&quot;&lt;p&gt;Lulusan Program Studi Teknologi Rekayasa Multimedia, telah berhasil terserap di dunia usaha dan industri, diantaranya perusahaan IT, BUMN, perusahaan pertambangan, perusahaan manufaktur, perbankan, Pegawai Negeri Sipil, dan wirausaha. Setelah mengikuti perkuliahan selama 8 semester, maka diharapkan para lulusan akan dapat menepati posisi kerja sebagai berikut&lt;\/p&gt;&quot;,&quot;akreditasi_gambar&quot;:&quot;program-studi\/akreditasi\/XZNJCYPPs1hm822cHUXroAfKN9wkcj0z7C1Nam1V.png&quot;,&quot;akreditasi_file&quot;:&quot;program-studi\/akreditasi\/0tlOL04p2nQZ8Yal6HGMtIHux38ulTZvBHgJdpjK.pdf&quot;,&quot;logo&quot;:&quot;program-studi\/logo\/DSiNtQaOthXzjDklvHDvbl3WnT3fQQroFG6cupUs.webp&quot;,&quot;logo_sidebar&quot;:&quot;program-studi\/logo\/lJTIOaIN0dbTH2B0NmRFCExOyxpunrAoSfgKh4c0.webp&quot;,&quot;deskripsi_en&quot;:null,&quot;visi_en&quot;:null,&quot;misi_en&quot;:null,&quot;tujuan_en&quot;:null,&quot;sasaran_strategis_en&quot;:null,&quot;peo_professional_en&quot;:null,&quot;peo_academic_en&quot;:null,&quot;peo_social_en&quot;:null,&quot;deskripsi_peo_en&quot;:null,&quot;deskripsi_cpl_en&quot;:null,&quot;deskripsi_capaian_en&quot;:null,&quot;deskripsi_kurikulum_en&quot;:null,&quot;deskripsi_peluang_kerja_en&quot;:null,&quot;website_url&quot;:&quot;https:\/\/if.polibatam.ac.id\/trm\/&quot;,&quot;show_akreditasi&quot;:true,&quot;show_vmts&quot;:true,&quot;show_profil&quot;:true,&quot;show_cpl&quot;:true,&quot;show_capaian&quot;:false,&quot;show_kurikulum&quot;:true,&quot;show_profil_lulusan&quot;:true,&quot;show_fasilitas&quot;:true,&quot;show_dosen&quot;:true,&quot;show_berita&quot;:true,&quot;link_kurikulum&quot;:null}},{&quot;id&quot;:73,&quot;nama&quot;:&quot;Yusuf Rizky Nur C. S. Sn. M.A&quo a Multimedia Politeknik Negeri Batam fokus untuk menyiapkan lulusan yang memiliki kompetensi pada bidang multimedia serta memiliki kemampuan tambahan di bidang informatika untuk menghasilkan karya teknologi yang dapat berguna serta dapat diimplementasikan di dunia industri. Secara umum, mahasiswa prodi Teknologi Rekayasa Multimedia akan menempuh perkuliahan selama 8 semester atau 4 tahun.&lt;\/p&gt;&quot;,&quot;akreditasi&quot;:&quot;Baik Sekali&quot;,&quot;akreditasi_en&quot;:null,&quot;visi&quot;:&quot;&lt;p&gt;Menjadi program studi vokasional yang bermutu, unggul, adaptif, inovatif, dan bermitra erat dengan industri dan masyarakat di bidang multimedia untuk mendukung Indonesia Maju dan Sejahtera 2045.&lt;\/p&gt;&quot;,&quot;misi&quot;:&quot;&lt;p&gt;Aktif dalam proses kreasi, penyebaran dan penerapan sains dan teknologi di bidang multimedia melalui layanan pendidikan tinggi vokasi dan penelitian terapan yang bermutu, terbuka, relevan, dan berkolaborasi erat dengan masyarakat dan industri dengan penerapan tata kelola institusi yang baik untuk kehidupan bangsa yang lebih baik.&lt;\/p&gt;&quot;,&quot;tujuan&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Terwujudnya layanan, sumber daya dan ouput pembelajaran dan penelitian di bidang multimedia yang bermutu, akses terbuka, inovatif, relevan dengan kebutuhan industri dan masyarakat.&lt;\/li&gt;\r\n&lt;li&gt;Terwujudnya program studi yang transparan, akuntabel, produktif, dan bermutu.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;sasaran_strategis&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Meningkatnya mutu, akses, relevansi dari layanan, sumberdaya dan output pembelajaran vokasi di bidang multimedia&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya mutu dan relevansi penelitian, publikasi hasil penelitian serta kemampuan penerapan iptek dan inovasi di bidang multimedia.&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya transparansi, akuntabilitas, produktivitas berorientasi kelestarian lingkungan dan mutu layanan, serta tata kelola program studi.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;peo_professional&quot;:&quot;&lt;p&gt;Mampu mengidentifikasi, menganalisis, dan menyelesaikan masalah secara kreatif, inovatif, profesional serta menghasilkan produk serta jasa di bidang multimedia sesuai dengan perkembangan teknologi yang tepat guna dan beretika.&lt;\/p&gt;&quot;,&quot;peo_academic&quot;:&quot;&lt;p&gt;Terlibat dalam kegiatan pengembangan karir profesional dan mempertahankan keunggulan kompetitif dalam pembelajaran seumur hidup melalui pendidikan lebih lanjut, penelitian terapan dan kegiatan profesional lainnya.&lt;\/p&gt;&quot;,&quot;peo_social&quot;:&quot;&lt;p&gt;Memiliki kemampuan komunikasi yang baik, memiliki kepemimpinan dan jiwa kewirausahaan dan mampu berkolaborasi dengan industri dan masyarakat untuk menghasilkan produk dan jasa multimedia&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-06-18T09:22:03.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-18T08:45:57.000000Z&quot;,&quot;deskripsi_peo&quot;:&quot;&lt;p&gt;Program Educational Objective (PEO) atau Profil Profesional Mandiri adalah pernyataan yang secara luas menggambarkan karir dan pencapaian profesional yang dipersiapkan oleh program untuk dicapai lulusan beberapa tahun setelah lulus dari program pendidikan.&lt;\/p&gt;&quot;,&quot;deskripsi_cpl&quot;:&quot;&lt;p&gt;Pemetaan Capaian Pembelajaran Lulusan (CPL) Program Studi Teknologi Rekayasa Multimedia Terhadap CPL IABEE Engineering Technologist&lt;\/p&gt;&quot;,&quot;deskripsi_capaian&quot;:&quot;&lt;p&gt;Capaian Pembelajaran (CP) program studi D4 Teknologi Rekayasa Multimedia telah merujuk pada SN-Dikti (Permendikbud No 49 tahun 2014) dan memiliki level sesuai dengan jenjang Kerangka Kualifikasi Nasional Indonesia\/KKNI (Perpres No.8 Tahun 2014). Setiap lulusan program studi D4 Teknologi Rekayasa Multimedia memiliki capaian pembelajaran sebagai berikut&lt;\/p&gt;&quot;,&quot;deskripsi_kurikulum&quot;:&quot;&lt;p&gt;urikulum adalah perangkat mata kuliah dan program pendidikan yang diberikan oleh suatu l Universitas Sumatera Utara- Linguistik&quot;,&quot;tahun&quot;:null,&quot;institusi&quot;:null}],&quot;sosial_media&quot;:[{&quot;url&quot;:&quot;https:\/\/sinta.kemdikbud.go.id\/authors\/profile\/&quot;,&quot;platform&quot;:&quot;Sinta&quot;},{&quot;url&quot;:&quot;https:\/\/orcid.org\/&quot;,&quot;platform&quot;:&quot;Scopus&quot;},{&quot;url&quot;:&quot;https:\/\/twitter.com\/&quot;,&quot;platform&quot;:&quot;Twitter&quot;},{&quot;url&quot;:&quot;https:\/\/facebook.com\/&quot;,&quot;platform&quot;:&quot;Facebook&quot;},{&quot;url&quot;:&quot;https:\/\/linkedin.com\/in\/&quot;,&quot;platform&quot;:&quot;Linkedin&quot;},{&quot;url&quot;:&quot;https:\/\/instagram.com\/&quot;,&quot;platform&quot;:&quot;Instagram&quot;}],&quot;jabatan_en&quot;:null,&quot;kata_kata_en&quot;:null,&quot;user_id&quot;:68,&quot;program_studi&quot;:{&quot;id&quot;:5,&quot;nama_program&quot;:&quot;D4  Teknologi Rekayasa Multimedia&quot;,&quot;slug&quot;:&quot;d4-teknologi-rekayasa-multimedia&quot;,&quot;gambar&quot;:null,&quot;warna_gradient&quot;:&quot;#ffffff,#f05d22&quot;,&quot;deskripsi&quot;:&quot;&lt;p&gt;Program Studi Sarjana Terapan Teknologi Rekayasa Multimedia Politeknik Negeri Batam fokus untuk menyiapkan lulusan yang memiliki kompetensi pada bidang multimedia serta memiliki kemampuan tambahan di bidang informatika untuk menghasilkan karya teknologi yang dapat berguna serta dapat diimplementasikan di dunia industri. Secara umum, mahasiswa prodi Teknologi Rekayasa Multimedia akan menempuh perkuliahan selama 8 semester atau 4 tahun.&lt;\/p&gt;&quot;,&quot;akreditasi&quot;:&quot;Baik Sekali&quot;,&quot;akreditasi_en&quot;:null,&quot;visi&quot;:&quot;&lt;p&gt;Menjadi program studi vokasional yang bermutu, unggul, adaptif, inovatif, dan bermitra erat dengan industri dan masyarakat di bidang multimedia untuk mendukung Indonesia Maju dan Sejahtera 2045.&lt;\/p&gt;&quot;,&quot;misi&quot;:&quot;&lt;p&gt;Aktif dalam proses kreasi, penyebaran dan penerapan sains dan teknologi di bidang multimedia melalui layanan pendidikan tinggi vokasi dan penelitian terapan yang bermutu, terbuka, relevan, dan berkolaborasi erat dengan masyarakat dan industri dengan penerapan tata kelola institusi yang baik untuk kehidupan bangsa yang lebih baik.&lt;\/p&gt;&quot;,&quot;tujuan&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Terwujudnya layanan, sumber daya dan ouput pembelajaran dan penelitian di bidang multimedia yang bermutu, akses terbuka, inovatif, relevan dengan kebutuhan industri dan masyarakat.&lt;\/li&gt;\r\n&lt;li&gt;Terwujudnya program studi yang transparan, akuntabel, produktif, dan bermutu.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;sasaran_strategis&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Meningkatnya mutu, akses, relevansi dari layanan, sumberdaya dan output pembelajaran vokasi di bidang multimedia&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya mutu dan relevansi penelitian, publikasi hasil penelitian serta kemampuan penerapan iptek dan inovasi di bidang multimedia.&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya transparansi, akuntabilitas, produktivitas berorientasi kelestarian lingkungan dan mutu layanan, serta tata kelola program studi.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;peo_professional&quot;:&quot;&lt;p&gt;Mampu mengidentifikasi, menganalisis, dan menyelesaikan masalah secara kreatif, inovatif, profesional serta menghasilkan produk serta jasa di bidang multimedia sesuai dengan perkembangan teknologi yang tepat guna dan beretika.&lt;\/p&gt;&quot;,&quot;peo_academic&quot;:&quot;&lt;p&gt;Terlibat dalam kegiatan pengembangan karir profesional dan mempertahankan keunggulan kompetitif dalam pembelajaran seumur hidup melalui pendidikan lebih lanjut, penelitian terapan dan kegiatan profesional lainnya.&lt;\/p&gt;&quot;,&quot;peo_social&quot;:&quot;&lt;p&gt;Memiliki kemampuan komunikasi yang baik, memiliki kepemimpinan dan jiwa kewirausahaan dan mampu berkolaborasi dengan industri dan masyarakat untuk menghasilkan produk dan jasa multimedia&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-06-18T09:22:03.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-18T08:45:57.000000Z&quot;,&quot;deskripsi_peo&quot;:&quot;&lt;p&gt;Program Educational Objective (PEO) atau Profil Profesional Mandiri adalah pernyataan yang secara luas menggambarkan karir dan pencapaian profesional yang dipersiapkan oleh program untuk dicapai lulusan beberapa tahun setelah lulus dari program pendidikan.&lt;\/p&gt;&quot;,&quot;deskripsi_cpl&quot;:&quot;&lt;p&gt;Pemetaan Capaian Pembelajaran Lulusan (CPL) Program Studi Teknologi Rekayasa Multimedia Terhadap CPL IABEE Engineering Technologist&lt;\/p&gt;&quot;,&quot;deskripsi_capaian&quot;:&quot;&lt;p&gt;Capaian Pembelajaran (CP) program studi D4 Teknologi Rekayasa Multimedia telah merujuk pada SN-Dikti (Permendikbud No 49 tahun 2014) dan memiliki level sesuai dengan jenjang Kerangka Kualifikasi Nasional Indonesia\/KKNI (Perpres No.8 Tahun 2014). Setiap lulusan program studi D4 Teknologi Rekayasa Multimedia memiliki capaian pembelajaran sebagai berikut&lt;\/p&gt;&quot;,&quot;deskripsi_kurikulum&quot;:&quot;&lt;p&gt;urikulum adalah perangkat mata kuliah dan program pendidikan yang diberikan oleh suatu lembaga penyelenggara pendidikan yang berisi rancangan pelajaran yang akan diberikan kepada peserta pelajaran dalam satu periode jenjang pendidikan&lt;\/p&gt;&quot;,&quot;deskripsi_peluang_kerja&quot;:&quot;&lt;p&gt;Lulusan Program Studi Teknologi Rekayasa Multimedia, telah berhasil terserap di dunia usaha dan industri, diantaranya perusahaan IT, BUMN, perusahaan pertambangan, perusahaan manufaktur, perbankan, Pegawai Negeri Sipil, dan wirausaha. Setelah mengikuti perkuliahan selama 8 semester, maka diharapkan para lulusan akan dapat menepati posisi kerja sebagai berikut&lt;\/p&gt;&quot;,&quot;akreditasi_gambar&quot;:&quot;program-studi\/akreditasi\/XZNJCYPPs1hm822cHUXroAfKN9wkcj0z7C1Nam1V.png&quot;,&quot;akreditasi_file&quot;:&quot;program-studi\/akreditasi\/0tlOL04p2nQZ8Yal6HGMtIHux38ulTZvBHgJdpjK.pdf&quot;,&quot;logo&quot;:&quot;program uot;}],&quot;sosial_media&quot;:[{&quot;url&quot;:&quot;https:\/\/sinta.kemdiktisaintek.go.id\/authors\/?q=BERLIANSYAH%20RUMODHON&quot;,&quot;platform&quot;:&quot;Sinta&quot;},{&quot;url&quot;:&quot;https:\/\/orcid.org\/&quot;,&quot;platform&quot;:&quot;Scopus&quot;},{&quot;url&quot;:&quot;https:\/\/instagram.com\/&quot;,&quot;platform&quot;:&quot;Instagram&quot;},{&quot;url&quot;:&quot;https:\/\/scholar.google.co.id\/citations?user=iAh5QoUAAAAJ&amp;hl=id&quot;,&quot;platform&quot;:&quot;Google Scholar&quot;}],&quot;jabatan_en&quot;:null,&quot;kata_kata_en&quot;:null,&quot;user_id&quot;:70,&quot;program_studi&quot;:{&quot;id&quot;:5,&quot;nama_program&quot;:&quot;D4  Teknologi Rekayasa Multimedia&quot;,&quot;slug&quot;:&quot;d4-teknologi-rekayasa-multimedia&quot;,&quot;gambar&quot;:null,&quot;warna_gradient&quot;:&quot;#ffffff,#f05d22&quot;,&quot;deskripsi&quot;:&quot;&lt;p&gt;Program Studi Sarjana Terapan Teknologi Rekayasa Multimedia Politeknik Negeri Batam fokus untuk menyiapkan lulusan yang memiliki kompetensi pada bidang multimedia serta memiliki kemampuan tambahan di bidang informatika untuk menghasilkan karya teknologi yang dapat berguna serta dapat diimplementasikan di dunia industri. Secara umum, mahasiswa prodi Teknologi Rekayasa Multimedia akan menempuh perkuliahan selama 8 semester atau 4 tahun.&lt;\/p&gt;&quot;,&quot;akreditasi&quot;:&quot;Baik Sekali&quot;,&quot;akreditasi_en&quot;:null,&quot;visi&quot;:&quot;&lt;p&gt;Menjadi program studi vokasional yang bermutu, unggul, adaptif, inovatif, dan bermitra erat dengan industri dan masyarakat di bidang multimedia untuk mendukung Indonesia Maju dan Sejahtera 2045.&lt;\/p&gt;&quot;,&quot;misi&quot;:&quot;&lt;p&gt;Aktif dalam proses kreasi, penyebaran dan penerapan sains dan teknologi di bidang multimedia melalui layanan pendidikan tinggi vokasi dan penelitian terapan yang bermutu, terbuka, relevan, dan berkolaborasi erat dengan masyarakat dan industri dengan penerapan tata kelola institusi yang baik untuk kehidupan bangsa yang lebih baik.&lt;\/p&gt;&quot;,&quot;tujuan&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Terwujudnya layanan, sumber daya dan ouput pembelajaran dan penelitian di bidang multimedia yang bermutu, akses terbuka, inovatif, relevan dengan kebutuhan industri dan masyarakat.&lt;\/li&gt;\r\n&lt;li&gt;Terwujudnya program studi yang transparan, akuntabel, produktif, dan bermutu.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;sasaran_strategis&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Meningkatnya mutu, akses, relevansi dari layanan, sumberdaya dan output pembelajaran vokasi di bidang multimedia&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya mutu dan relevansi penelitian, publikasi hasil penelitian serta kemampuan penerapan iptek dan inovasi di bidang multimedia.&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya transparansi, akuntabilitas, produktivitas berorientasi kelestarian lingkungan dan mutu layanan, serta tata kelola program studi.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;peo_professional&quot;:&quot;&lt;p&gt;Mampu mengidentifikasi, menganalisis, dan menyelesaikan masalah secara kreatif, inovatif, profesional serta menghasilkan produk serta jasa di bidang multimedia sesuai dengan perkembangan teknologi yang tepat guna dan beretika.&lt;\/p&gt;&quot;,&quot;peo_academic&quot;:&quot;&lt;p&gt;Terlibat dalam kegiatan pengembangan karir profesional dan mempertahankan keunggulan kompetitif dalam pembelajaran seumur hidup melalui pendidikan lebih lanjut, penelitian terapan dan kegiatan profesional lainnya.&lt;\/p&gt;&quot;,&quot;peo_social&quot;:&quot;&lt;p&gt;Memiliki kemampuan komunikasi yang baik, memiliki kepemimpinan dan jiwa kewirausahaan dan mampu berkolaborasi dengan industri dan masyarakat untuk menghasilkan produk dan jasa multimedia&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-06-18T09:22:03.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-18T08:45:57.000000Z&quot;,&quot;deskripsi_peo&quot;:&quot;&lt;p&gt;Program Educational Objective (PEO) atau Profil Profesional Mandiri adalah pernyataan yang secara luas menggambarkan karir dan pencapaian profesional yang dipersiapkan oleh program untuk dicapai lulusan beberapa tahun setelah lulus dari program pendidikan.&lt;\/p&gt;&quot;,&quot;deskripsi_cpl&quot;:&quot;&lt;p&gt;Pemetaan Capaian Pembelajaran Lulusan (CPL) Program Studi Teknologi Rekayasa Multimedia Terhadap CPL IABEE Engineering Technologist&lt;\/p&gt;&quot;,&quot;deskripsi_capaian&quot;:&quot;&lt;p&gt;Capaian Pembelajaran (CP) program studi D4 Teknologi Rekayasa Multimedia telah merujuk pada SN-Dikti (Permendikbud No 49 tahun 2014) dan memiliki level sesuai dengan jenjang Kerangka Kualifikasi Nasional Indonesia\/KKNI (Perpres No.8 Tahun 2014). Setiap lulusan program studi D4 Teknologi Rekayasa Multimedia memiliki capaian pembelajaran sebagai berikut&lt;\/p&gt;&quot;,&quot;deskripsi_kurikulum&quot;:&quot;&lt;p&gt;urikulum adalah perangkat mata kuliah dan program pendidikan yang diberikan oleh suatu lembaga penyelenggara pendidikan yang berisi rancangan pelajaran yang akan diberikan kepada peserta pelajaran dalam satu periode jenjang pendidikan&lt;\/p&gt;&quot;,&quot;deskripsi_peluang_kerja&quot;:&quot;&lt;p&gt;Lulusan Program Studi Teknologi Rekayasa Multimedia, telah berhasil terserap di dunia usaha dan industri, diantaranya perusahaan IT, BUMN, perusahaan pertambangan, perusahaan manufaktur, perbankan, Pegawai Negeri Sipil, dan wirausaha. Setelah mengikuti perkuliahan selama 8 semester, maka diharapkan para lulusan akan dapat menepati posisi kerja sebagai berikut&lt;\/p&gt;&quot;,&quot;akreditasi_gambar&quot;:&quot;program-studi\/akreditasi\/XZNJCYPPs1hm822cHUXroAfKN9wkcj0z7C1Nam1V.png&quot;,&quot;akreditasi_file&quot;:&quot;program-studi\/akreditasi\/0tlOL04p2nQZ8Yal6HGMtIHux38ulTZvBHgJdpjK.pdf&quot;,&quot;logo&quot;:&quot;program-studi\/logo\/DSiNtQaOthXzjDklvHDvbl3WnT3fQQroFG6cupUs.webp&quot;,&quot;logo_sidebar&quot;:&quot;program-studi\/logo\/lJTIOaIN0dbTH2B0NmRFCExOyxpunrAoSfgKh4c0.webp&quot;,&quot;deskripsi_en&quot;:null,&quot;visi_en andiangan S.Sn.,M.Sn&quot;,&quot;nidn&quot;:&quot;125350&quot;,&quot;jabatan&quot;:&quot;Dosen&quot;,&quot;kategori&quot;:&quot;Dosen&quot;,&quot;keahlian&quot;:&quot;Music, Ethnomusicology, Performing Arts&quot;,&quot;kata_kata&quot;:null,&quot;gambar&quot;:&quot;dosen\/LljieBLKN45RnMCaXgruoSu8MqmLXkUSGC18qQW9.jpg&quot;,&quot;created_at&quot;:&quot;2026-07-09T08:49:45.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-07-13T07:59:14.000000Z&quot;,&quot;program_studi_id&quot;:5,&quot;nik&quot;:&quot;125350&quot;,&quot;pendidikan_terakhir&quot;:&quot;Magister Strata 2 (S2)&quot;,&quot;email&quot;:&quot;kawan@polibatam.ac.id&quot;,&quot;riwayat_pendidikan&quot;:[{&quot;gelar&quot;:&quot;Sarjana (S1) Universitas Sumatera Utara - Etnomusikologi&quot;,&quot;tahun&quot;:null,&quot;institusi&quot;:null},{&quot;gelar&quot;:&quot;Magister (S2) Universitas Sumatera Utara - Penciptaan dan Pengkajian Seni&quot;,&quot;tahun&quot;:null,&quot;institusi&quot;:null}],&quot;sosial_media&quot;:[{&quot;url&quot;:&quot;https:\/\/sinta.kemdikbud.go.id\/authors\/profile\/&quot;,&quot;platform&quot;:&quot;Sinta&quot;},{&quot;url&quot;:&quot;https:\/\/orcid.org\/&quot;,&quot;platform&quot;:&quot;Scopus&quot;},{&quot;url&quot;:&quot;https:\/\/twitter.com\/&quot;,&quot;platform&quot;:&quot;Twitter&quot;},{&quot;url&quot;:&quot;https:\/\/facebook.com\/&quot;,&quot;platform&quot;:&quot;Facebook&quot;},{&quot;url&quot;:&quot;https:\/\/linkedin.com\/in\/&quot;,&quot;platform&quot;:&quot;Linkedin&quot;},{&quot;url&quot;:&quot;https:\/\/instagram.com\/&quot;,&quot;platform&quot;:&quot;Instagram&quot;}],&quot;jabatan_en&quot;:null,&quot;kata_kata_en&quot;:null,&quot;user_id&quot;:81,&quot;program_studi&quot;:{&quot;id&quot;:5,&quot;nama_program&quot;:&quot;D4  Teknologi Rekayasa Multimedia&quot;,&quot;slug&quot;:&quot;d4-teknologi-rekayasa-multimedia&quot;,&quot;gambar&quot;:null,&quot;warna_gradient&quot;:&quot;#ffffff,#f05d22&quot;,&quot;deskripsi&quot;:&quot;&lt;p&gt;Program Studi Sarjana Terapan Teknologi Rekayasa Multimedia Politeknik Negeri Batam fokus untuk menyiapkan lulusan yang memiliki kompetensi pada bidang multimedia serta memiliki kemampuan tambahan di bidang informatika untuk menghasilkan karya teknologi yang dapat berguna serta dapat diimplementasikan di dunia industri. Secara umum, mahasiswa prodi Teknologi Rekayasa Multimedia akan menempuh perkuliahan selama 8 semester atau 4 tahun.&lt;\/p&gt;&quot;,&quot;akreditasi&quot;:&quot;Baik Sekali&quot;,&quot;akreditasi_en&quot;:null,&quot;visi&quot;:&quot;&lt;p&gt;Menjadi program studi vokasional yang bermutu, unggul, adaptif, inovatif, dan bermitra erat dengan industri dan masyarakat di bidang multimedia untuk mendukung Indonesia Maju dan Sejahtera 2045.&lt;\/p&gt;&quot;,&quot;misi&quot;:&quot;&lt;p&gt;Aktif dalam proses kreasi, penyebaran dan penerapan sains dan teknologi di bidang multimedia melalui layanan pendidikan tinggi vokasi dan penelitian terapan yang bermutu, terbuka, relevan, dan berkolaborasi erat dengan masyarakat dan industri dengan penerapan tata kelola institusi yang baik untuk kehidupan bangsa yang lebih baik.&lt;\/p&gt;&quot;,&quot;tujuan&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Terwujudnya layanan, sumber daya dan ouput pembelajaran dan penelitian di bidang multimedia yang bermutu, akses terbuka, inovatif, relevan dengan kebutuhan industri dan masyarakat.&lt;\/li&gt;\r\n&lt;li&gt;Terwujudnya program studi yang transparan, akuntabel, produktif, dan bermutu.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;sasaran_strategis&quot;:&quot;&lt;ol&gt;\r\n&lt;li&gt;Meningkatnya mutu, akses, relevansi dari layanan, sumberdaya dan output pembelajaran vokasi di bidang multimedia&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya mutu dan relevansi penelitian, publikasi hasil penelitian serta kemampuan penerapan iptek dan inovasi di bidang multimedia.&lt;\/li&gt;\r\n&lt;li&gt;Meningkatnya transparansi, akuntabilitas, produktivitas berorientasi kelestarian lingkungan dan mutu layanan, serta tata kelola program studi.&lt;\/li&gt;\r\n&lt;\/ol&gt;&quot;,&quot;peo_professional&quot;:&quot;&lt;p&gt;Mampu mengidentifikasi, menganalisis, dan menyelesaikan masalah secara kreatif, inovatif, profesional serta menghasilkan produk serta jasa di bidang multimedia sesuai dengan perkembangan teknologi yang tepat guna dan beretika.&lt;\/p&gt;&quot;,&quot;peo_academic&quot;:&quot;&lt;p&gt;Terlibat dalam kegiatan pengembangan karir profesional dan mempertahankan keunggulan kompetitif dalam pembelajaran seumur hidup melalui pendidikan lebih lanjut, penelitian terapan dan kegiatan profesional lainnya.&lt;\/p&gt;&quot;,&quot;peo_social&quot;:&quot;&lt;p&gt;Memiliki kemampuan komunikasi yang baik, memiliki kepemimpinan dan jiwa kewirausahaan dan mampu berkolaborasi dengan industri dan masyarakat untuk menghasilkan produk dan jasa multimedia&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2026-06-18T09:22:03.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-08-18T08:45:57.000000Z&quot;,&quot;deskripsi_peo&quot;:&quot;&lt;p&gt;Program Educational Objective (PEO) atau Profil Profesional Mandiri adalah pernyataan yang secara luas menggambarkan karir dan pencapaian profesional yang dipersiapkan oleh program untuk dicapai lulusan beberapa tahun setelah lulus dari program pendidikan.&lt;\/p&gt;&quot;,&quot;deskripsi_cpl&quot;:&quot;&lt;p&gt;Pemetaan Capaian Pembelajaran Lulusan (CPL) Program Studi Teknologi Rekayasa Multimedia Terhadap CPL IABEE Engineering Technologist&lt;\/p&gt;&quot;,&quot;deskripsi_capaian&quot;:&quot;&lt;p&gt;Capaian Pembelajaran (CP) program studi D4 Teknologi Rekayasa Multimedia telah merujuk pada SN-Dikti (Permendikbud No 49 tahun 2014) dan memiliki level sesuai dengan jenjang Kerangka Kualifikasi Nasional Indonesia\/KKNI (Perpres No.8 Tahun 2014). Setiap lulusan program studi D4 Teknologi Rekayasa Multimedia memiliki capaian pembelajaran sebagai berikut&lt;\/p&gt;&quot;,&quot;deskripsi_kurikulum&quot;:&quot;&lt;p&gt;urikulum adalah perangkat mata kuliah dan program pendidikan yang diberikan oleh suatu lembaga penyelenggara pendidikan yang berisi rancangan pelajaran yang akan diberikan kepada peserta pelajaran dalam satu periode jenjang pendidikan&lt;\/p&gt;&quot;,&quot;deskripsi_peluang_kerja&quot;:&quot;&lt;p&gt;Lulusan Program Studi Teknologi Rekayasa Multimedia, telah berhasil terserap di dunia usaha dan industri, diantaranya perusahaan IT, BUMN, perusahaan pertambangan, perusahaan manufaktur, perbankan, Pegawai Negeri Sipil, dan wirausaha. Setelah mengikuti perkuliahan selama 8 semester, maka diharapkan para lulusan akan dapat menepati posisi kerja sebagai berikut&lt;\/p&gt;&quot;,&quot;akreditasi_gambar&quot;:&quot;program-studi\/akreditasi\/XZNJCYPPs1hm822cHUXroAfKN9wkcj0z7C1Nam1V.png&quot;,&quot;akreditasi_file&quot;:&quot;program-studi\/akreditasi\/0tlOL04p2nQZ8Yal6HGMtIHux38ulTZvBHgJdpjK.pdf&quot;,&quot;logo&quot;:&quot;program-studi\/logo\/DSiNtQaOthXzjDklvHDvbl3WnT3fQQroFG6cupUs.webp&quot;,&quot;logo_sidebar&quot;:&quot;program-studi\/logo\/lJTIOaIN0dbTH2B0NmRFCExOyxpunrAoSfgKh4c0.webp&quot;,&quot;deskripsi_en&quot;:null,&quot;visi_en&quot;:null,&quot;misi_en&quot;:null,&quot;tujuan_en&quot;:null,&quot;sasaran_strategis_en&quot;:null,&quot;peo_professional_en&quot;:null,&quot;peo_academic_en&quot;:null,&quot;peo_social_en&quot;:null,&quot;deskripsi_peo_en&quot;:null,&quot;deskripsi_cpl_en&quot;:null,&quot;deskripsi_capaian_en&quot;:null,&quot;deskripsi_kurikulum_en&quot;:null,&quot;deskripsi_peluang_kerja_en&quot;:null,&quot;website_url&quot;:&quot;https:\/\/if.polibatam.ac.id\/trm\/&quot;,&quot;show_akreditasi&quot;:true,&quot;show_vmts&quot;:true,&quot;show_profil&quot;:true,&quot;show_cpl&quot;:true,&quot;show_capaian&quot;:false,&quot;show_kurikulum&quot;:true,&quot;show_profil_lulusan&quot;:true,&quot;show_fasilitas&quot;:true,&quot;show_dosen&quot;:true,&quot;show_berita&quot;:true,&quot;link_kurikulum&quot;:null}},{&quot;id&quot;:87,&quot;nama&quot;:&quot;Sri Rahayu, M.Pd&quot;,&quot;nidn&quot;:&quot;125359&quot;,&quot;jabatan&quot
